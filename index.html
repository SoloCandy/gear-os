// ---- Persistence ----
// Single flat key covering every input (gear-os has no chassis/tune split
// like susp-os to justify separate keys). See docs/PERSISTENCE.md.
const PERSIST_KEY='gearos_inputs_v1';
function loadPersisted(){
  try{
    const s=localStorage.getItem(PERSIST_KEY);
    return s?JSON.parse(s):{};
  }catch(e){return {};} // private browsing or parse error — fall back to defaults
}

// mph = Engine_RPM * 2*pi * TireRadius(mm) * 60 / (1609344 * Ratio * FinalDrive)
// (wheel RPM = engine RPM / (ratio*FD); wheel circumference = 2*pi*r; convert mm/min -> mph)
function speedAtRpm(rpm,ratio,finalDrive,tireRadius){
  return rpm*2*Math.PI*tireRadius*60/(MM_PER_MILE*ratio*finalDrive);
}

function computeGearing({maxRpm,peakHpRpm,peakTorqueRpm,gearCount,topSpeedMph,tireRadius,target1stMph,target1stPct,tightnessBias,topGearRatioOverride}){
  const N=gearCount;
  if(!(Number.isInteger(N)&&N>=2&&N<=10))return {error:'Gear count must be a whole number between 2 and 10.'};
  if(!(maxRpm>0))return {error:'Max RPM must be positive.'};
  if(!(topSpeedMph>0))return {error:'Desired top speed must be positive.'};
  if(!(tireRadius>0))return {error:'Tire radius must be positive.'};
  if(target1stMph!=null){
    if(!(target1stMph>0))return {error:'Target 1st gear speed must be positive.'};
    if(!(target1stMph<topSpeedMph))return {error:'Target 1st Gear Speed must be less than Desired Top Speed.'};
  }
  if(target1stPct!=null&&!(target1stPct>=0&&target1stPct<=100)){
    return {error:'1st Gear % Powerband must be between 0 and 100.'};
  }
  if(!(peakTorqueRpm>0&&peakHpRpm>peakTorqueRpm&&maxRpm>=peakHpRpm)){
    return {error:'RPMs must satisfy 0 < Peak Torque RPM < Peak HP RPM ≤ Max RPM.'};
  }

  const numShifts=N-1;
  // Spacing Curve Bias (-100..+100) warps the linear shift-progress `t` into
  // t^powerFactor. powerFactor=1 at bias=0 (linear). Bias>0 (powerFactor>1)
  // keeps t low through most shifts — wide RPM drops persist longer, only
  // tightening up sharply in the last shift(s), so high gears end up tighter.
  // Bias<0 (powerFactor<1) pushes t up early — shifts tighten up sooner, so
  // low gears end up tighter. t=0 and t=1 (the first and last shift) are
  // unaffected either way.
  const powerFactor=Math.pow(2,(tightnessBias||0)/50);
  const shiftProgress=i=>{
    const t=numShifts>1?i/(numShifts-1):0;
    return Math.pow(t,powerFactor);
  };

  // Overall gearing spread (Ratio_1/Ratio_N) produced by landing every shift's
  // RPM along a line from `startDrop` (1st->2nd shift) to Peak HP RPM (last
  // shift), interpolated across the numShifts-1 shifts in between per the
  // bias curve above.
  const spreadForStartDrop=startDrop=>{
    let spread=1;
    for(let i=0;i<numShifts;i++){
      const drop=startDrop+(peakHpRpm-startDrop)*shiftProgress(i);
      spread*=maxRpm/drop;
    }
    return spread;
  };

  // Normally the 1st->2nd shift lands at Peak Torque RPM (the Variable Power
  // Band default). If Target 1st Gear Speed is set, top gear's speed and 1st
  // gear's speed both need to be hit exactly — but their ratio is fixed by
  // the interpolation above, so instead of picking one over the other, solve
  // for whatever landing RPM (in place of Peak Torque RPM) makes the
  // resulting spread match exactly what both targets require simultaneously.
  // spreadForStartDrop is strictly decreasing in startDrop, so bisect for it.
  let startDropRpm=peakTorqueRpm;
  if(target1stPct!=null){
    // Direct solve: pin the 1st->2nd shift's landing RPM to a percentage of
    // the Peak Torque RPM -> Max RPM band (same % the Gearing table reports
    // per shift below), independent of Desired Top Speed.
    startDropRpm=maxRpm-(target1stPct/100)*(maxRpm-peakTorqueRpm);
  }else if(target1stMph!=null){
    const requiredSpread=topSpeedMph/target1stMph;
    let low=0,high=maxRpm,iterations=0;
    while(high-low>1&&iterations<50){
      const mid=(low+high)/2;
      if(spreadForStartDrop(mid)>requiredSpread)low=mid;else high=mid;
      iterations++;
    }
    startDropRpm=(low+high)/2;
  }

  // Target landing RPM for each shift g -> g+1 (g = 1..N-1), interpolated
  // from startDropRpm (first shift) to the HP peak (last shift) per the
  // bias curve above.
  const landingRpm=new Array(N+1).fill(0);
  for(let g=1;g<N;g++){
    landingRpm[g]=startDropRpm+shiftProgress(g-1)*(peakHpRpm-startDropRpm);
  }

  // Back-solve ratios from top gear (arbitrarily set to 1.00) down to 1st.
  // Scale-invariant: only the ratio *between* gears matters here, so the
  // absolute scale (and therefore Final Drive) can be fixed independently below.
  const rawRatio=new Array(N+1).fill(0);
  rawRatio[N]=1.00;
  for(let g=N-1;g>=1;g--){
    rawRatio[g]=rawRatio[g+1]*(maxRpm/landingRpm[g]);
  }

  // Solve Final Drive so top gear hits Desired Top Speed at Max RPM. When
  // Target 1st Gear Speed was set, the startDropRpm solve above already
  // makes 1st gear land on its target too, at this same Final Drive.
  const fdRaw=maxRpm*2*Math.PI*tireRadius*60/(MM_PER_MILE*rawRatio[N]*topSpeedMph);

  // Normalize: find a uniform scale s (ratio[g]*=s, FD/=s) that fits both the
  // per-gear range and the Final Drive range. This is safe because the product
  // ratio*FD (and thus every RPM/speed relationship, including 1st gear's) is
  // invariant under it. Take the s closest to 1 that suits Final Drive, then
  // pull it into the gear-ratio range — when both ranges overlap this lands
  // in the overlap; when they don't, it lands on the gear-range edge nearest
  // Final Drive's range, so Final Drive clamps as little as possible.
  const s=clamp(clamp(1,fdRaw/FINAL_DRIVE_MAX,fdRaw/FINAL_DRIVE_MIN),
    GEAR_RATIO_MIN/rawRatio[N],GEAR_RATIO_MAX/rawRatio[1]);

  const finalDrive=clamp(fdRaw/s,FINAL_DRIVE_MIN,FINAL_DRIVE_MAX);
  const gears=[];
  for(let g=1;g<=N;g++){
    const ratio=clamp(rawRatio[g]*s,GEAR_RATIO_MIN,GEAR_RATIO_MAX);
    gears.push({gear:g,ratio,speedAtRedline:speedAtRpm(maxRpm,ratio,finalDrive,tireRadius)});
  }

  // Manual top-gear override: a surgical alternative to the tire-radius/FD
  // workaround for matching Forza's own (power/drag-limited, not purely
  // kinematic) Top Speed stat. Only replaces the last gear's ratio — Final
  // Drive and every other gear stay exactly as solved above, same as
  // dragging just the top-gear slider in Forza's own tune screen.
  if(topGearRatioOverride!=null){
    const ratio=clamp(topGearRatioOverride,GEAR_RATIO_MIN,GEAR_RATIO_MAX);
    gears[N-1]={gear:N,ratio,speedAtRedline:speedAtRpm(maxRpm,ratio,finalDrive,tireRadius)};
  }

  // If a gear ratio or Final Drive had to clamp to Forza's range, one or both
  // targets may come up short — check each directly rather than trusting `feasible`.
  // An override that moves top speed is the user's choice, not a miss: it's
  // reported as topSpeedOverridden instead, and doesn't make the solve infeasible.
  const actualTopSpeed=gears[N-1].speedAtRedline;
  const topSpeedOff=Math.abs(actualTopSpeed-topSpeedMph)>Math.max(0.5,topSpeedMph*0.01);
  const topSpeedOverridden=topGearRatioOverride!=null&&topSpeedOff;
  const topSpeedMissed=topGearRatioOverride==null&&topSpeedOff;
  const actualFirstGearSpeed=gears[0].speedAtRedline;
  const firstGearMissed=target1stMph!=null&&Math.abs(actualFirstGearSpeed-target1stMph)>Math.max(0.5,target1stMph*0.01);

  // % of the power band (Peak Torque RPM -> Max RPM) still ahead of the landing
  // point — i.e. how much of it the next gear actually gets to use. Landing at
  // the torque peak (low gears) uses the full band (100%); landing near
  // redline (high gears) leaves little band left to use (low %). Always
  // measured against the engine's actual Peak Torque RPM, even if a solved
  // startDropRpm (for Target 1st Gear Speed) lands somewhere else.
  // Derived from the final ratios, not the landingRpm targets, so it stays
  // true when a ratio was clamped or the top gear was overridden. Not clamped:
  // >100% means the shift lands below Peak Torque RPM, <0% above Max RPM
  // (an overridden top gear taller than the gear before it).
  const shifts=[];
  for(let g=1;g<N;g++){
    const actualLandingRpm=maxRpm*gears[g].ratio/gears[g-1].ratio;
    const pct=(maxRpm-actualLandingRpm)/(maxRpm-peakTorqueRpm)*100;
    shifts.push({from:g,to:g+1,landingRpm:actualLandingRpm,powerBandPct:pct});
  }

  return {finalDrive,gears,shifts,feasible:!topSpeedMissed&&!firstGearMissed,
    actualTopSpeed,actualFirstGearSpeed,topSpeedMissed,topSpeedOverridden,firstGearMissed,
    startDropRpm,peakHpRpm,peakTorqueRpm};
}

// Most gears (below the requested count) that hit every target inside
// Forza's limits, or null if even fewer gears don't help (the miss comes from
// the speed/tire/RPM inputs, not the gear count). With too many gears for the
// engine's band the solver lets top gear miss its target (see KNOWN_ISSUES.md);
// this is what the warning suggests instead. Ignores the top gear override.
function maxFittingGears(args){
  for(let n=args.gearCount-1;n>=2;n--){
    const r=computeGearing({...args,gearCount:n,topGearRatioOverride:null});
    if(!r.error&&r.feasible)return n;
  }
  return null;
}

// Hover (mouse) or tap (touch) info icon with a viewport-clamped tooltip.
// Ported from susp-os's Hint component.
function Hint({text}){
  const [pos,setPos]=useState(null);
  const ref=useRef(null);
  const isTouch=useRef(false);

  const calcPos=()=>{
    if(!ref.current)return null;
    const r=ref.current.getBoundingClientRect();
    const PAD=8,GAP=6;
    const TW=Math.min(260,window.innerWidth-PAD*2);
    const TH=240;
    const showBelow=r.bottom+GAP+TH<=window.innerHeight;
    const top=Math.max(PAD,showBelow?r.bottom+GAP:r.top-TH-GAP);
    const iconCx=(r.left+r.right)/2;
    const left=Math.max(PAD,Math.min(iconCx-TW/2,window.innerWidth-TW-PAD));
    return{top,left,width:TW};
  };

  const onMouseEnter=()=>{ if(!isTouch.current) setPos(calcPos()); };
  const onMouseLeave=()=>{ if(!isTouch.current) setPos(null); };
  const onClick=e=>{
    isTouch.current=true;
    e.stopPropagation();
    setPos(p=>p?null:calcPos());
  };

  useEffect(()=>{
    if(!pos)return;
    const dismiss=()=>setPos(null);
    const t=setTimeout(()=>document.addEventListener('click',dismiss,{once:true}),10);
    return()=>{clearTimeout(t);document.removeEventListener('click',dismiss);};
  },[pos]);

  return(
    <span ref={ref} style={{display:'inline-block',cursor:'help',WebkitTapHighlightColor:'transparent'}}
          onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}
          onTouchStart={()=>{isTouch.current=true;}}
          onClick={onClick}>
      <span style={{fontSize:10,color:'#94a3b8'}}>ⓘ</span>
      {pos&&ReactDOM.createPortal(
        <div style={{position:'fixed',top:pos.top,left:pos.left,zIndex:1000,width:pos.width??220,
                     background:'#0f172a',border:'1px solid #e2e8f011',borderRadius:2,
                     padding:'7px 9px',fontSize:11,color:'#94a3b8',lineHeight:1.6,
                     pointerEvents:'none',boxShadow:'0 4px 16px #00000088'}}>
          {text}
        </div>,
        document.body
      )}
    </span>
  );
}

function NumField({label,value,onChange,autoValue,auto,onAutoChange,min,max,step,unit,hint}){
  const dispVal=auto?round(autoValue,0):value;
  const pct=max>min?clamp((dispVal-min)/(max-min)*100,0,100):0;
  return (
    <div className="field">
      {/* Not a <label>: a label forwards any click inside it (e.g. on the
          Hint icon) to the checkbox, toggling AUTO by accident. */}
      <div className="label">
        <span style={{display:'flex',alignItems:'center',gap:4}}>{label}{hint&&<Hint text={hint}/>}</span>
        {onAutoChange&&
          <span className="auto-tog" onClick={()=>onAutoChange(!auto)}>
            <input type="checkbox" checked={auto} readOnly style={{pointerEvents:'none'}}/>AUTO
          </span>}
      </div>
      <input
        className="finput"
        type="number"
        min={min}
        max={max}
        step={step||1}
        disabled={auto}
        value={dispVal}
        onChange={e=>onChange(Number(e.target.value))}
      />
      {max!=null&&
        <input
          className="sli"
          type="range"
          min={min}
          max={max}
          step={step||1}
          disabled={auto}
          value={clamp(dispVal,min,max)}
          style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
          onChange={e=>onChange(Number(e.target.value))}
        />}
      {unit&&<div className="hint">{unit}</div>}
    </div>
  );
}

// Classic RPM-vs-speed sawtooth: each gear rises from its landing RPM to
// redline as speed climbs, then drops back to the next gear's landing RPM
// at that same speed the instant you shift.
function GearChart({gears,shifts,maxRpm,peakHpRpm,peakTorqueRpm,metricUnits}){
  const svgRef=useRef(null);
  // Same fix as the Dyno Graph: keep the viewBox width equal to the SVG's
  // real rendered width so 1 unit = 1 pixel. A fixed viewBox here (e.g. 700)
  // was invisibly letterboxed inside the much wider main-content card —
  // the chart was rendering ~700px wide, centered, with blank margins on
  // both sides that blended into the matching dark background.
  const [measuredWidth,setMeasuredWidth]=useState(900);
  useEffect(()=>{
    const el=svgRef.current;
    if(!el)return;
    const ro=new ResizeObserver(entries=>{
      const w=entries[0].contentRect.width;
      if(w>0)setMeasuredWidth(Math.round(w));
    });
    ro.observe(el);
    return()=>ro.disconnect();
  },[]);

  const conv=mph=>metricUnits?mph*KMH_PER_MPH:mph;
  const unit=metricUnits?'km/h':'mph';
  // One segment per gear — just the rise from its landing point to redline.
  // No line drawn for the shift itself (the vertical drop back down), since
  // that's an instant, not something the car actually traces through.
  const segments=[];
  let landingRpm=0,landingSpeed=0;
  gears.forEach((g,i)=>{
    const speed=conv(g.speedAtRedline);
    segments.push([[landingSpeed,landingRpm],[speed,maxRpm]]);
    const sh=shifts[i];
    landingSpeed=speed;
    landingRpm=sh?sh.landingRpm:maxRpm;
  });
  const pts=segments.flat();
  const W=measuredWidth,H=280,padL=52,padR=80,padT=14,padB=28;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const xMax=pts[pts.length-1][0]*1.04;
  const yMax=maxRpm*1.05;
  const sx=v=>padL+(v/xMax)*plotW;
  const sy=v=>padT+plotH-(v/yMax)*plotH;
  const ticks=[0,0.25,0.5,0.75,1];
  const gridCols=20,gridRows=8;
  const refLines=[
    {rpm:maxRpm,color:'#ef4444',label:'REDLINE'},
    {rpm:peakHpRpm,color:'#f59e0b',label:'PEAK HP'},
    {rpm:peakTorqueRpm,color:'#38bdf8',label:'PEAK TQ'},
  ];
  return (
    <React.Fragment>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" height={H}
           style={{display:'block',background:'#020617',borderRadius:3}}>
        {Array.from({length:gridCols+1}).map((_,i)=>{
          const x=padL+(i/gridCols)*plotW;
          return <line key={'gx'+i} x1={x} y1={padT} x2={x} y2={H-padB} stroke="#293548" strokeWidth={1}/>;
        })}
        {Array.from({length:gridRows+1}).map((_,i)=>{
          const y=padT+(i/gridRows)*plotH;
          return <line key={'gy'+i} x1={padL} y1={y} x2={W-padR} y2={y} stroke="#293548" strokeWidth={1}/>;
        })}
        {ticks.map(t=>(
          <text key={'y'+t} x={padL-6} y={sy(t*yMax)+3} textAnchor="end" fontSize={11}
            fill="#6b7280" fontFamily="JetBrains Mono, monospace">{Math.round(t*yMax)}</text>
        ))}
        {ticks.map(t=>(
          <text key={'x'+t} x={sx(t*xMax)} y={H-padB+18} textAnchor="middle" fontSize={11}
            fill="#6b7280" fontFamily="JetBrains Mono, monospace">{Math.round(t*xMax)}</text>
        ))}
        {refLines.map(r=>(
          <React.Fragment key={r.label}>
            <line x1={padL} y1={sy(r.rpm)} x2={W-padR} y2={sy(r.rpm)} stroke={r.color} strokeWidth={1} strokeDasharray="4 3" opacity={0.8}/>
            <text x={W-padR+6} y={sy(r.rpm)+3} fontSize={10} fill={r.color} fontFamily="JetBrains Mono, monospace">{r.label}</text>
          </React.Fragment>
        ))}
        {segments.map((seg,i)=>(
          <line key={i} x1={sx(seg[0][0])} y1={sy(seg[0][1])} x2={sx(seg[1][0])} y2={sy(seg[1][1])}
            stroke="#e2e8f0" strokeWidth={2} strokeLinecap="round"/>
        ))}
        {pts.map((p,i)=>(
          <circle key={i} cx={sx(p[0])} cy={sy(p[1])} r={3} fill="#e2e8f0"/>
        ))}
      </svg>
      <div className="hint" style={{marginTop:6}}>Speed in {unit} · RPM on the vertical axis</div>
    </React.Fragment>
  );
}

// Mirrors the grid Forza's own dyno graph shows (fixed rows/columns; only the
// axis-scale input changes what RPM each column actually represents). Drag
// any line directly onto where you see that peak on your own dyno screen —
// no ordering enforced between the three, same as typing values directly.
function DynoInput({maxRpm,setMaxRpm,peakHpRpm,setHpRpm,setAutoHp,peakTorqueRpm,setTorqueRpm,setAutoTorque,scale,setScale}){
  const svgRef=useRef(null);
  const [dragging,setDragging]=useState(null); // 'tq'|'hp'|'redline'|null
  // viewBox width is kept equal to the SVG's real rendered width (via
  // ResizeObserver) so 1 coordinate unit = 1 real pixel. Without this, a
  // fixed viewBox (e.g. 700) squeezed into a ~280px-wide sidebar forces the
  // browser to scale everything down ~0.4x to preserve the aspect ratio,
  // which both shrinks the fonts and letterboxes blank space above/below.
  const [measuredWidth,setMeasuredWidth]=useState(280);
  useEffect(()=>{
    const el=svgRef.current;
    if(!el)return;
    const ro=new ResizeObserver(entries=>{
      const w=entries[0].contentRect.width;
      if(w>0)setMeasuredWidth(Math.round(w));
    });
    ro.observe(el);
    return()=>ro.disconnect();
  },[]);
  const axisMaxRpm=scale*1000;
  const W=measuredWidth,padL=10,padR=10,padT=54,padB=26;
  const plotW=Math.max(0,W-padL-padR); // 0 while unmeasured (hidden pane/tab) -- never a negative <rect> height
  const plotH=plotW*3/4; // grid itself is a 4:3 landscape rectangle
  const H=padT+plotH+padB;

  const rpmToX=rpm=>padL+clamp(rpm/axisMaxRpm,0,1)*plotW;
  const xToRpm=x=>clamp(Math.round(((x-padL)/plotW)*axisMaxRpm/50)*50,0,axisMaxRpm);
  const clientXToRpm=clientX=>{
    const rect=svgRef.current.getBoundingClientRect();
    const internalX=(clientX-rect.left)*(W/rect.width);
    return xToRpm(internalX);
  };

  const startDrag=which=>e=>{
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){/* best-effort; drag still works without capture */}
    setDragging(which);
  };
  const onMove=e=>{
    if(!dragging)return;
    const rpm=clientXToRpm(e.clientX);
    if(dragging==='redline')setMaxRpm(rpm);
    else if(dragging==='hp'){setAutoHp(false);setHpRpm(rpm);}
    else if(dragging==='tq'){setAutoTorque(false);setTorqueRpm(rpm);}
  };
  const endDrag=()=>setDragging(null);

  const lines=[
    {key:'tq',rpm:peakTorqueRpm,color:'#38bdf8',label:'PEAK TQ',labelY:16},
    {key:'hp',rpm:peakHpRpm,color:'#f59e0b',label:'PEAK HP',labelY:33},
    {key:'redline',rpm:maxRpm,color:'#ef4444',label:'REDLINE',labelY:50},
  ];
  const ticks=[0,0.25,0.5,0.75,1];

  return (
    <div className="card">
      <div className="ch">Dyno Graph</div>
      <div className="cb">
      <NumField label="Graph Scale" value={scale} onChange={setScale} min={4} max={20} step={1}
        unit="×1000 RPM — sets what the rightmost gridline represents"
        hint="Only reframes the grid below — doesn't affect any calculation. Raise it if your redline runs off the right edge, lower it to spread the three lines out for easier dragging."/>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" height={H}
        style={{display:'block',background:'#020617',borderRadius:3,touchAction:'none',marginTop:8,
                WebkitUserSelect:'none',userSelect:'none',WebkitTouchCallout:'none'}}
        onPointerMove={onMove} onPointerUp={endDrag} onPointerCancel={endDrag}
        onContextMenu={e=>e.preventDefault()}>
        {Array.from({length:11}).map((_,i)=>{
          const x=padL+(i/10)*plotW;
          return <line key={'gx'+i} x1={x} y1={padT} x2={x} y2={H-padB} stroke="#293548" strokeWidth={1}/>;
        })}
        {Array.from({length:9}).map((_,i)=>{
          const y=padT+(i/8)*plotH;
          return <line key={'gy'+i} x1={padL} y1={y} x2={W-padR} y2={y} stroke="#293548" strokeWidth={1}/>;
        })}
        {ticks.map(t=>(
          <text key={'t'+t} x={rpmToX(t*axisMaxRpm)} y={H-padB+20} textAnchor="middle" fontSize={12}
            fill="#6b7280" fontFamily="JetBrains Mono, monospace">{Math.round(t*scale)}</text>
        ))}
        {lines.map(l=>{
          const x=rpmToX(l.rpm);
          // Center-anchoring this label on the line overflows the SVG edge
          // once the line sits near either boundary — anchor to whichever
          // side keeps the text on-screen instead.
          const anchor=x>W-65?'end':x<65?'start':'middle';
          return (
            <React.Fragment key={l.key}>
              <line x1={x} y1={padT} x2={x} y2={H-padB} stroke={l.color} strokeWidth={2.5}/>
              <text x={x} y={l.labelY} textAnchor={anchor} fontSize={13} fontWeight="700" fill={l.color}
                fontFamily="JetBrains Mono, monospace">{l.label} {Math.round(l.rpm)}</text>
              <rect x={x-22} y={padT} width={44} height={H-padB-padT} fill="transparent"
                style={{cursor:'ew-resize',touchAction:'none',WebkitUserSelect:'none',userSelect:'none',
                        WebkitTouchCallout:'none'}}
                onPointerDown={startDrag(l.key)} onContextMenu={e=>e.preventDefault()}/>
            </React.Fragment>
          );
        })}
      </svg>
      <div className="hint" style={{marginTop:6}}>
        Drag a line onto where you see that peak on your Forza dyno screen · RPM (×1000) along the bottom
      </div>
      </div>
    </div>
  );
}

// Collapsible sidebar section — mirrors susp-os's Sec component: a toggle
// header (▲/▼) with an optional two-step-confirm RESET, body only rendered
// while open.
function Sec({title,open,onToggle,onReset,children}){
  const [pending,setPending]=useState(false);
  const timer=useRef(null);
  const handleReset=e=>{
    e.stopPropagation();
    if(pending){clearTimeout(timer.current);setPending(false);onReset();}
    else{setPending(true);timer.current=setTimeout(()=>setPending(false),2000);}
  };
  return (
    <div className="sec">
      <button className={`stog${open?' stog-open':''}`} onClick={onToggle}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:2,height:10,borderRadius:1,flexShrink:0,
                       background:open?'#e2e8f0':'#1e293b',transition:'background .12s'}}/>
          <span>{title}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {onReset&&<span
            onClick={handleReset}
            title={pending?'Click again to confirm':'Reset to defaults'}
            style={{fontSize:10,color:pending?'#f59e0b':'#94a3b8',padding:'1px 5px',borderRadius:2,
                    border:`1px solid ${pending?'#f59e0b44':'#1e293b'}`,lineHeight:1.4,cursor:'pointer',
                    transition:'color .12s,border-color .12s',userSelect:'none'}}>
            {pending?'SURE?':'RESET'}
          </span>}
          <span style={{fontSize:11,color:open?'#e2e8f0':'#94a3b8',transition:'color .12s'}}>
            {open?'▲':'▼'}
          </span>
        </div>
      </button>
      {open&&<div className="sec-body">{children}</div>}
    </div>
  );
}

function App(){
  // Loaded exactly once via useState's lazy-initializer form — every field
  // below reads its default from this same snapshot so a reload restores
  // the last session instead of resetting to factory defaults.
  const [saved]=useState(loadPersisted);
  const [metricUnits,setMetricUnits]=useState(()=>saved.metricUnits??false);
  const [maxRpm,setMaxRpm]=useState(()=>saved.maxRpm??8000);
  const [autoHp,setAutoHp]=useState(()=>saved.autoHp??true);
  const [hpRpm,setHpRpm]=useState(()=>saved.hpRpm??7200);
  const [autoTorque,setAutoTorque]=useState(()=>saved.autoTorque??true);
  const [torqueRpm,setTorqueRpm]=useState(()=>saved.torqueRpm??5200);
  const [gearCount,setGearCount]=useState(()=>saved.gearCount??6);
  const [topSpeed,setTopSpeed]=useState(()=>saved.topSpeed??180); // canonical: mph
  const [tireRadius,setTireRadius]=useState(()=>saved.tireRadius??330); // canonical: mm
  const [tireSize,setTireSize]=useState(()=>saved.tireSize??''); // e.g. "255/40R19" — feeds tireRadius when tireInputMode is 'size'
  const [tireInputMode,setTireInputMode]=useState(()=>saved.tireInputMode??'size'); // 'size' | 'radius' — which of the two above is shown/editable
  const [topGearOverride,setTopGearOverride]=useState(()=>saved.topGearOverride??null); // optional manual top-gear ratio, bypasses the solved value for that gear only
  const [target1stSpeed,setTarget1stSpeed]=useState(()=>saved.target1stSpeed??null); // canonical: mph, null = unset
  const [target1stPct,setTarget1stPct]=useState(()=>saved.target1stPct??null); // 0..100, null = unset
  const [target1stMode,setTarget1stMode]=useState(()=>saved.target1stMode??'mph'); // 'mph' | 'pct' — which field drives the solve
  const [tightnessBias,setTightnessBias]=useState(()=>saved.tightnessBias??0); // -100..100, 0 = linear
  const [dynoScale,setDynoScale]=useState(()=>saved.dynoScale??9); // x1000 rpm, dyno graph axis width

  // Re-derive tireRadius from tireSize whenever size mode is active — covers
  // both typing a new size and switching back into size mode after tireRadius
  // was hand-edited in radius mode (which otherwise would go stale).
  useEffect(()=>{
    if(tireInputMode!=='size')return;
    const p=parseTyre(tireSize);
    if(p?.radius!=null)setTireRadius(round(p.radius,1));
  },[tireInputMode,tireSize]); // eslint-disable-line

  // Auto-save on every change — mirrors susp-os's usePersist hook, just
  // flattened to one combined snapshot instead of per-slice keys.
  useEffect(()=>{
    try{
      localStorage.setItem(PERSIST_KEY,JSON.stringify({
        metricUnits,maxRpm,autoHp,hpRpm,autoTorque,torqueRpm,gearCount,
        topSpeed,tireRadius,tireSize,tireInputMode,topGearOverride,
        target1stSpeed,target1stPct,target1stMode,tightnessBias,dynoScale,
      }));
    }catch(e){/* private browsing or quota — silently skip */}
  },[metricUnits,maxRpm,autoHp,hpRpm,autoTorque,torqueRpm,gearCount,
     topSpeed,tireRadius,tireSize,tireInputMode,topGearOverride,
     target1stSpeed,target1stPct,target1stMode,tightnessBias,dynoScale]);

  const [sidebarOpen,setSidebarOpen]=useState(true);
  const [isMobile,setIsMobile]=useState(false);
  const [windowWidth,setWindowWidth]=useState(window.innerWidth);
  const [openSections,setOpenSections]=useState({engine:true,gearbox:true});

  // Same breakpoint-crossing pattern as susp-os: only force sidebarOpen's
  // default when mobile/desktop actually flips, not on every resize tick.
  useEffect(()=>{
    let prevMobile=null;
    const check=()=>{
      const w=window.innerWidth;
      const mobile=w<768;
      setIsMobile(mobile);
      setWindowWidth(w);
      if(prevMobile===null||mobile!==prevMobile)setSidebarOpen(!mobile);
      prevMobile=mobile;
    };
    check();
    window.addEventListener('resize',check);
    return()=>window.removeEventListener('resize',check);
  },[]);

  // Mobile: 88% of the screen capped at 360 (as SUSP.OS), so small phones keep
  // a tappable backdrop strip and large phones get the room.
  const sidebarWidth=isMobile?Math.min(360,Math.floor(windowWidth*0.88)):Math.min(420,Math.max(320,Math.floor(windowWidth*0.25)));
  const swipeRef=useRef(null);
  // Escape closes the mobile drawer.
  useEffect(()=>{
    if(!isMobile||!sidebarOpen)return;
    const onKey=e=>{if(e.key==='Escape')setSidebarOpen(false);};
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[isMobile,sidebarOpen]);
  const togSection=key=>()=>setOpenSections(p=>({...p,[key]:!p[key]}));

  const D=DEFAULT_INPUTS;
  const resetEngine=()=>{
    setMaxRpm(D.maxRpm);setAutoHp(D.autoHp);setHpRpm(D.hpRpm);setAutoTorque(D.autoTorque);setTorqueRpm(D.torqueRpm);setDynoScale(9);
  };
  const applyInputs=v=>{
    setMaxRpm(v.maxRpm);setAutoHp(v.autoHp);setHpRpm(v.hpRpm);setAutoTorque(v.autoTorque);setTorqueRpm(v.torqueRpm);
    setGearCount(v.gearCount);setTopSpeed(v.topSpeed);setTireRadius(v.tireRadius);setTireSize(v.tireSize);
    setTireInputMode(v.tireInputMode);setTopGearOverride(v.topGearOverride);setTarget1stSpeed(v.target1stSpeed);
    setTarget1stPct(v.target1stPct);setTarget1stMode(v.target1stMode);setTightnessBias(v.tightnessBias);
  };
  const currentInputs={maxRpm,autoHp,hpRpm,autoTorque,torqueRpm,gearCount,topSpeed,tireRadius,
    tireSize,tireInputMode,topGearOverride,target1stSpeed,target1stPct,target1stMode,tightnessBias};
  const shareCode=encodeInputs(currentInputs);
  const [panel,setPanel]=useState(null); // 'share' | 'garage' | null
  const shareOpen=panel==='share';
  const setShareOpen=v=>setPanel(v?'share':null);
  const togglePanel=name=>{setPanel(p=>p===name?null:name);setShareMsg(null);setGarageMsg(null);setConfirmDel(null);};

  const [garage,setGarage]=useState(loadGarage);
  const [saveName,setSaveName]=useState('');
  const [garageMsg,setGarageMsg]=useState(null); // {ok,text}
  const [confirmDel,setConfirmDel]=useState(null); // name awaiting SURE?
  const restoreRef=useRef(null);
  useEffect(()=>{
    try{localStorage.setItem(GARAGE_KEY,JSON.stringify(garage));}catch(e){/* private browsing or quota */}
  },[garage]);
  const nameTaken=!!saveName.trim()&&garage.some(e=>garageKey(e.name)===garageKey(saveName));
  const saveToGarage=()=>{
    const n=saveName.trim();
    if(!n)return;
    setGarage(g=>garageUpsert(g,n,shareCode,Date.now()));
    setGarageMsg({ok:true,text:nameTaken?`Replaced "${n}".`:`Saved "${n}".`});
    setSaveName('');
  };
  const loadFromGarage=e=>{
    try{applyInputs(decodeInputs(e.code));setGarageMsg({ok:true,text:`Loaded "${e.name}".`});}
    catch(err){setGarageMsg({ok:false,text:`"${e.name}": ${err.message}`});}
  };
  const deleteFromGarage=name=>{
    if(confirmDel!==name){setConfirmDel(name);return;}
    setGarage(g=>garageRemove(g,name));setConfirmDel(null);setGarageMsg({ok:true,text:`Deleted "${name}".`});
  };
  const garageSummary=code=>{
    try{const v=decodeInputs(code);return `${v.gearCount} gears · ${dispSpeed(v.topSpeed)} · ${v.maxRpm} rpm`;}
    catch(e){return 'unreadable code';}
  };
  const backupGarage=()=>{
    try{
      const blob=new Blob([JSON.stringify({app:'gear-os',garage},null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`gear-os-garage-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      setGarageMsg({ok:true,text:`Backed up ${garage.length} setup${garage.length===1?'':'s'}.`});
    }catch(e){setGarageMsg({ok:false,text:'Backup failed in this browser.'});}
  };
  const restoreGarage=file=>{
    if(!file)return;
    file.text().then(t=>{
      const incoming=sanitizeGarage(JSON.parse(t));
      if(!incoming.length)throw new Error('empty');
      setGarage(g=>garageMerge(g,incoming));
      setGarageMsg({ok:true,text:`Restored ${incoming.length} setup${incoming.length===1?'':'s'}. Newer saves win on name clashes.`});
    }).catch(()=>setGarageMsg({ok:false,text:'Not a GEAR.OS garage backup.'}));
  };
  const [loadText,setLoadText]=useState('');
  const [shareMsg,setShareMsg]=useState(null); // {ok,text}
  const copyText=(t,label)=>{
    const fail=()=>setShareMsg({ok:false,text:'Copy blocked. Select the code and copy it by hand.'});
    try{navigator.clipboard.writeText(t).then(()=>setShareMsg({ok:true,text:`${label} copied.`}),fail);}
    catch(e){fail();}
  };
  // A code is staged, not applied: the pane offers its parts (engine, top
  // speed, gearbox) so a shared setup can be taken piecemeal. Nothing on
  // screen changes until APPLY.
  const [pending,setPending]=useState(null); // {inputs,from:'link'|'paste'}
  const [parts,setParts]=useState({engine:true,topSpeed:true,gearbox:true});
  // The ticks are always on screen, so a load never moves them: what the
  // user set before pasting is what gets taken.
  const stageCode=(code,from)=>{
    try{
      const v=decodeInputs(code);
      setPending({inputs:v,from});
      setShareMsg(null);
      return true;
    }catch(e){setPending(null);setShareMsg({ok:false,text:e.message});return false;}
  };
  const applyPending=()=>{
    if(!pending)return;
    const chosen=SHARE_PARTS.filter(p=>parts[p.id]);
    if(!chosen.length){setShareMsg({ok:false,text:'Pick at least one part to load.'});return;}
    applyInputs(mergeInputs(currentInputs,pending.inputs,parts));
    setShareMsg({ok:true,text:`Loaded ${chosen.map(p=>p.label.toLowerCase()).join(' + ')}.`});
    setPending(null);setLoadText('');
  };
  const partSummary=(id,v)=>{
    if(id==='engine')return `${v.maxRpm} rpm redline · torque ${v.autoTorque?'auto':v.torqueRpm+' rpm'} · hp ${v.autoHp?'auto':v.hpRpm+' rpm'}`;
    if(id==='topSpeed')return dispSpeed(v.topSpeed);
    return `${v.gearCount} gears · ${v.tireInputMode==='size'&&v.tireSize?v.tireSize:round(v.tireRadius,1)+' mm'}`
      +(v.topGearOverride?` · top gear ${v.topGearOverride}`:'');
  };
  // A shared link (...#g=CODE) stages once on open, then the hash is cleared
  // so a reload doesn't restage over later edits.
  useEffect(()=>{
    const m=location.hash.match(/^#g=(.+)$/);
    if(!m)return;
    stageCode(m[1],'link');setShareOpen(true);
    history.replaceState(null,'',location.pathname+location.search);
  },[]); // eslint-disable-line
  const resetGearbox=()=>{
    setGearCount(D.gearCount);setTopSpeed(D.topSpeed);setTireRadius(D.tireRadius);setTireSize(D.tireSize);setTireInputMode(D.tireInputMode);
    setTopGearOverride(D.topGearOverride);setTarget1stSpeed(D.target1stSpeed);
    setTarget1stPct(D.target1stPct);setTarget1stMode(D.target1stMode);setTightnessBias(D.tightnessBias);
  };

  const dispSpeed=mph=>metricUnits?`${round(mph*KMH_PER_MPH,1)} km/h`:`${round(mph,1)} mph`;

  const peakHpRpm=autoHp?round(maxRpm*0.90):hpRpm;
  const peakTorqueRpm=autoTorque?round(maxRpm*0.65):torqueRpm;

  const solveArgs={
    maxRpm,peakHpRpm,peakTorqueRpm,gearCount,topSpeedMph:topSpeed,tireRadius,
    target1stMph:target1stMode==='mph'?target1stSpeed:null,
    target1stPct:target1stMode==='pct'?target1stPct:null,
    tightnessBias,topGearRatioOverride:topGearOverride
  };
  const result=useMemo(()=>computeGearing(solveArgs),[maxRpm,peakHpRpm,peakTorqueRpm,gearCount,topSpeed,tireRadius,
      target1stMode,target1stSpeed,target1stPct,tightnessBias,topGearOverride]);

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="topbar-inner">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button className={`hamburger${sidebarOpen?' on':''}`} onClick={()=>setSidebarOpen(p=>!p)}>
              {sidebarOpen?'✕':'☰'}
            </button>
            <div className="brand">
              <b>GEAR.OS</b>
              <span>Forza Gear Ratio Calculator — Variable Power Band</span>
            </div>
          </div>
          <div className="unit-toggle">
            <button className={`tbtn${shareOpen?' on':''}`} style={{marginRight:6}}
              onClick={()=>togglePanel('share')}>SHARE</button>
            <button className={`tbtn${panel==='garage'?' on':''}`} style={{marginRight:6}}
              onClick={()=>togglePanel('garage')}>GARAGE</button>
            <button className={`tbtn${!metricUnits?' on':''}`} onClick={()=>setMetricUnits(false)}>IMP</button>
            <button className={`tbtn${metricUnits?' on':''}`} onClick={()=>setMetricUnits(true)}>MET</button>
          </div>
        </div>
      </div>
      {shareOpen&&
        <div className="share-panel">
          <div className="share-row">
            <span className="share-label">YOUR CODE</span>
            <input className="share-input" readOnly value={shareCode} onFocus={e=>e.target.select()}/>
            <button className="tbtn" onClick={()=>copyText(shareCode,'Code')}>COPY CODE</button>
            <button className="tbtn" onClick={()=>copyText(location.origin+location.pathname+'#g='+shareCode,'Link')}>COPY LINK</button>
          </div>
          <div className="share-row">
            <span className="share-label">LOAD CODE</span>
            <input className="share-input" placeholder="Paste a code or link" value={loadText}
              onChange={e=>setLoadText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&loadText.trim())stageCode(loadText,'paste');}}/>
            <button className="tbtn" disabled={!loadText.trim()} onClick={()=>stageCode(loadText,'paste')}>LOAD</button>
          </div>
          <div className="pick-box">
            <div className="share-note" style={{margin:0}}>
              {pending
                ?(pending.from==='link'?'This link carries a setup. Ticked parts load, the rest keep your values:':'This code is ready. Ticked parts load, the rest keep your values:')
                :'Parts to take from the next code you load:'}
            </div>
            {SHARE_PARTS.map(p=>{
              const on=!!parts[p.id];
              const same=pending&&!partDiffers(currentInputs,pending.inputs,p.id);
              return(
                <label key={p.id} className={`pick-part${on?' on':''}`}>
                  <input type="checkbox" checked={on}
                    onChange={()=>{setParts(x=>({...x,[p.id]:!x[p.id]}));setShareMsg(null);}}/>
                  <b>{p.label}</b>
                  <span>{partSummary(p.id,pending?pending.inputs:currentInputs)}</span>
                  {pending?(same?<em>same as yours</em>:null):<em>yours now</em>}
                </label>
              );
            })}
            {pending&&
              <div className="share-row" style={{gap:6}}>
                <button className="tbtn on" onClick={applyPending}>APPLY SELECTED</button>
                <button className="tbtn" onClick={()=>{setPending(null);setShareMsg(null);}}>DISCARD</button>
              </div>}
          </div>
          <div className="share-note" style={shareMsg?{color:shareMsg.ok?'#4ade80':'#f87171'}:undefined}>
            {shareMsg?shareMsg.text:'A loaded code replaces only the parts you tick. Units and the dyno view are not shared.'}
          </div>
        </div>}
      {panel==='garage'&&
        <div className="share-panel">
          <div className="share-row">
            <span className="share-label">SAVE AS</span>
            <input className="share-input" placeholder="Name this setup, e.g. Supra 6-speed" maxLength={GARAGE_NAME_MAX}
              value={saveName} onChange={e=>setSaveName(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')saveToGarage();}}/>
            <button className="tbtn" disabled={!saveName.trim()} onClick={saveToGarage}>{nameTaken?'REPLACE':'SAVE'}</button>
          </div>
          {garage.length===0
            ?<div className="share-note">No saved setups yet. Name the current one above to save it.</div>
            :<div className="garage-list">
              {garage.map(e=>{
                const current=e.code===shareCode;
                return <div key={e.name} className={`garage-item${current?' current':''}`}>
                  <div className="garage-info">
                    <b>{e.name}</b>{current&&<span className="garage-tag">CURRENT</span>}
                    <span>{garageSummary(e.code)}</span>
                  </div>
                  <div className="garage-actions">
                    <button className="tbtn" onClick={()=>loadFromGarage(e)}>LOAD</button>
                    <button className="tbtn" onClick={()=>copyText(location.origin+location.pathname+'#g='+e.code,`Link for "${e.name}"`)}>LINK</button>
                    <button className="tbtn" style={confirmDel===e.name?{color:'#f87171',borderColor:'#f8717166'}:undefined}
                      onClick={()=>deleteFromGarage(e.name)}>{confirmDel===e.name?'SURE?':'DELETE'}</button>
                  </div>
                </div>;
              })}
            </div>}
          <div className="share-row">
            <button className="tbtn" disabled={!garage.length} onClick={backupGarage}>BACKUP</button>
            <button className="tbtn" onClick={()=>restoreRef.current?.click()}>RESTORE</button>
            <input ref={restoreRef} type="file" accept=".json,application/json" style={{display:'none'}}
              onChange={e=>{restoreGarage(e.target.files[0]);e.target.value='';}}/>
            <span className="share-note" style={{width:'auto',margin:0,flex:1,...(garageMsg||shareMsg?{color:(garageMsg||shareMsg).ok?'#4ade80':'#f87171'}:{})}}>
              {(garageMsg||shareMsg)?.text??'Saves live in this browser only. Use BACKUP to keep a copy or move them to another device.'}
            </span>
          </div>
        </div>}
      <div className="body-shell">
        {/* Always mounted on mobile so it can fade; pointer-events off while closed. */}
        {isMobile&&
          <div className="backdrop" onClick={()=>setSidebarOpen(false)}
            style={{opacity:sidebarOpen?1:0,pointerEvents:sidebarOpen?'auto':'none'}}/>}
        {/* Mobile: stays mounted and hides by transform + visibility, because a
            display:none toggle kills the slide. visibility is delayed on close so
            the drawer is still visible while it slides out, and it keeps a closed
            drawer out of the tab order. A leftward swipe closes it. */}
        <div className={`sidebar${isMobile?' mobile':''}`}
          onTouchStart={isMobile?e=>{
            // Not from a control: dragging a slider thumb left is a slider move,
            // and a drag in a text field is a selection. Neither may close the drawer.
            if(e.target.closest('input,select,textarea,svg')){swipeRef.current=null;return;}
            const t=e.touches[0];swipeRef.current={x:t.clientX,y:t.clientY,done:false};}:undefined}
          onTouchMove={isMobile?e=>{
            const sw=swipeRef.current;if(!sw||sw.done)return;
            const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
            if(Math.abs(dy)>30&&Math.abs(dy)>Math.abs(dx)){sw.done=true;return;} // a scroll, not a swipe
            if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.5){sw.done=true;setSidebarOpen(false);}
          }:undefined}
          style={{
          width:sidebarWidth,
          ...(isMobile?{transform:sidebarOpen?'translateX(0)':'translateX(-100%)',
            visibility:sidebarOpen?'visible':'hidden',
            transition:sidebarOpen?'transform .2s ease':'transform .2s ease, visibility 0s linear .2s'}
            :{display:sidebarOpen?'block':'none'})
        }}>
          <div className="sections-row">
            <span>SECTIONS</span>
            <button className="tbtn" style={{fontSize:10}}
              onClick={()=>setOpenSections({engine:false,gearbox:false})}>−</button>
            <button className="tbtn" style={{fontSize:10}}
              onClick={()=>setOpenSections({engine:true,gearbox:true})}>+</button>
          </div>
          <Sec title="Engine" open={openSections.engine} onToggle={togSection('engine')} onReset={resetEngine}>
              <DynoInput maxRpm={maxRpm} setMaxRpm={setMaxRpm}
                peakHpRpm={peakHpRpm} setHpRpm={setHpRpm} setAutoHp={setAutoHp}
                peakTorqueRpm={peakTorqueRpm} setTorqueRpm={setTorqueRpm} setAutoTorque={setAutoTorque}
                scale={dynoScale} setScale={setDynoScale}/>
              <NumField label="Max RPM (Redline)" value={maxRpm} onChange={setMaxRpm} min={4000} max={12000} step={100}
                hint="Your engine's rev limiter. Read it off the dyno graph above, or your car's stat screen. Every gear is solved to land exactly here."/>
              <NumField label="Peak HP RPM" value={hpRpm} onChange={setHpRpm}
                auto={autoHp} onAutoChange={setAutoHp} autoValue={maxRpm*0.90} min={1000} max={maxRpm} step={100}
                unit={autoHp?'Auto: 90% of Max RPM':undefined}
                hint="Where horsepower peaks on the dyno graph. The last shift always lands here, keeping your highest gears close to peak power."/>
              <NumField label="Peak Torque RPM" value={torqueRpm} onChange={setTorqueRpm}
                auto={autoTorque} onAutoChange={setAutoTorque} autoValue={maxRpm*0.65} min={500} max={peakHpRpm} step={100}
                unit={autoTorque?'Auto: 65% of Max RPM':undefined}
                hint="Where torque peaks on the dyno graph. The 1st→2nd shift lands here by default, so 1st gear uses the widest slice of the power band."/>
          </Sec>
          <Sec title="Gearbox & Chassis" open={openSections.gearbox} onToggle={togSection('gearbox')} onReset={resetGearbox}>
              <NumField label="Gear Count" value={gearCount} onChange={setGearCount} min={2} max={10} step={1}
                hint="How many forward gears your transmission has, 2–10. More gears means tighter ratio steps and more shift points on the Gear Ladder chart."/>
              <NumField label="Desired Top Speed"
                value={metricUnits?round(topSpeed*KMH_PER_MPH,0):topSpeed}
                onChange={v=>setTopSpeed(metricUnits?v/KMH_PER_MPH:v)}
                min={metricUnits?round(30*KMH_PER_MPH,0):30}
                max={metricUnits?round(300*KMH_PER_MPH,0):300} step={1}
                unit={metricUnits?'km/h':'mph'}
                hint="For the most accurate Final Drive, don't guess this number. In-game, pick a gear tall enough that you run out of pull before redline, hold full throttle, and watch the speedometer stop climbing — that plateau is your car's real top speed. Use it here instead of a spec-sheet figure."/>
              <div className="field">
                <label>
                  <span style={{display:'flex',alignItems:'center',gap:4}}>Tire Radius
                    <Hint text="Two ways to set the driven wheel's rolling radius (rear for RWD, front for FWD, either for AWD). TIRE SIZE: enter e.g. 255/40R19 and the radius computes via the same geometric formula SUSP.OS uses. RADIUS: type the mm value directly. Either way, treat the number as a starting point — Forza's actual in-game Top Speed stat has been observed to differ from this geometric figure by anywhere from ~1% to ~10%, in either direction, most likely because that stat is a real power/drag-limited simulation result, not a pure redline × gearing calculation. Verify against it and adjust, or use the Top Gear Ratio override below instead."/>
                  </span>
                </label>
                <div style={{display:'flex',gap:3,marginBottom:6}}>
                  <button className={`tbtn${tireInputMode==='size'?' on':''}`} style={{flex:1}}
                    onClick={()=>setTireInputMode('size')}>TIRE SIZE</button>
                  <button className={`tbtn${tireInputMode==='radius'?' on':''}`} style={{flex:1}}
                    onClick={()=>setTireInputMode('radius')}>RADIUS (mm)</button>
                </div>
                {tireInputMode==='size'?(()=>{
                  const parsedSize=parseTyre(tireSize);
                  const isBlank=tireSize.trim()==='';
                  return(<React.Fragment>
                    <input type="text" className="finput" value={tireSize}
                      onChange={e=>setTireSize(e.target.value)}
                      placeholder="255/40r19"
                      style={{borderColor:isBlank||parsedSize?undefined:'#7f1d1d'}}/>
                    <div className="hint">
                      {isBlank
                        ?'blank — switch to RADIUS to set it directly'
                        :parsedSize
                          ?parsedSize.radius!=null
                            ?`Ø ${parsedSize.diameter.toFixed(0)} mm → r ${parsedSize.radius.toFixed(1)} mm`
                            :'incomplete — need width/aspect/rim (e.g. 255/40R19)'
                          :'invalid format'}
                    </div>
                  </React.Fragment>);
                })():(()=>{
                  const pct=clamp((tireRadius-125)/(500-125)*100,0,100);
                  return(<React.Fragment>
                    <input className="finput" type="number" min={125} max={500} step={1}
                      value={tireRadius} onChange={e=>setTireRadius(Number(e.target.value))}/>
                    <input className="sli" type="range" min={125} max={500} step={1}
                      value={clamp(tireRadius,125,500)}
                      style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
                      onChange={e=>setTireRadius(Number(e.target.value))}/>
                    <div className="hint">mm (rolling radius)</div>
                  </React.Fragment>);
                })()}
              </div>
              <div className="field">
                <label>
                  <span style={{display:'flex',alignItems:'center',gap:4}}>Top Gear Ratio
                    <Hint text="Optional manual override for just the top gear's ratio — a direct, surgical alternative to nudging Tire Radius when dialing in top speed against Forza's own Top Speed stat. Final Drive and every other gear stay exactly as solved; only this one gear's ratio (and therefore its speed at redline, shown in the GEARING table below) changes. Matches dragging just the top-gear slider in Forza's tune screen, rather than the Final Drive slider which scales every gear at once."/>
                  </span>
                  {topGearOverride!=null&&
                    <span className="auto-tog" onClick={()=>setTopGearOverride(null)}>CLEAR</span>}
                </label>
                <input
                  className="finput"
                  type="number"
                  placeholder="Optional"
                  min={GEAR_RATIO_MIN}
                  max={GEAR_RATIO_MAX}
                  step={0.01}
                  value={topGearOverride==null?'':topGearOverride}
                  onChange={e=>{
                    const raw=e.target.value;
                    if(raw===''){setTopGearOverride(null);return;}
                    const v=Number(raw);
                    if(Number.isFinite(v))setTopGearOverride(v);
                  }}/>
                <div className="hint">leave blank to use the solved top-gear ratio</div>
              </div>
              <div className="field">
                <label>
                  <span style={{display:'flex',alignItems:'center',gap:4}}>1st Gear Target
                    <Hint text="Solves the 1st→2nd shift point instead of always landing it at Peak Torque RPM. SPEED: hit an exact 1st-gear speed at redline without giving up Desired Top Speed. % POWERBAND: pin the shift directly to a percentage of the Peak Torque RPM→Max RPM band — 100% matches the default (lands at Peak Torque RPM), lower values pull the shift point up toward redline, which pulls 1st gear's ratio closer to 2nd's and makes 1st gear taller (reaches a higher speed before shifting). Solved independently of Desired Top Speed."/>
                  </span>
                  {((target1stMode==='mph'&&target1stSpeed!=null)||(target1stMode==='pct'&&target1stPct!=null))&&
                    <span className="auto-tog" onClick={()=>{setTarget1stSpeed(null);setTarget1stPct(null);}}>CLEAR</span>}
                </label>
                <div style={{display:'flex',gap:3,marginBottom:6}}>
                  <button className={`tbtn${target1stMode==='mph'?' on':''}`} style={{flex:1}}
                    onClick={()=>setTarget1stMode('mph')}>SPEED</button>
                  <button className={`tbtn${target1stMode==='pct'?' on':''}`} style={{flex:1}}
                    onClick={()=>setTarget1stMode('pct')}>% POWERBAND</button>
                </div>
                {target1stMode==='mph'?<React.Fragment>
                  <input
                    className="finput"
                    type="number"
                    placeholder="Optional"
                    min={metricUnits?round(10*KMH_PER_MPH,0):10}
                    max={metricUnits?round(120*KMH_PER_MPH,0):120}
                    step={1}
                    value={target1stSpeed==null?'':(metricUnits?round(target1stSpeed*KMH_PER_MPH,0):target1stSpeed)}
                    onChange={e=>{
                      const raw=e.target.value;
                      if(raw===''){setTarget1stSpeed(null);return;}
                      const v=Number(raw);
                      setTarget1stSpeed(metricUnits?v/KMH_PER_MPH:v);
                    }}
                  />
                  <div className="hint">
                    {metricUnits?'km/h':'mph'} — leave blank to ignore. When set, GEAR.OS solves
                    for both this and Desired Top Speed at once by adjusting where the 1st→2nd
                    shift lands (instead of always landing at Peak Torque RPM).
                  </div>
                </React.Fragment>:<React.Fragment>
                  <input
                    className="finput"
                    type="number"
                    placeholder="Optional"
                    min={0}
                    max={100}
                    step={1}
                    value={target1stPct==null?'':target1stPct}
                    onChange={e=>{
                      const raw=e.target.value;
                      if(raw===''){setTarget1stPct(null);return;}
                      setTarget1stPct(clamp(Number(raw),0,100));
                    }}
                  />
                  <div className="hint">
                    % of Peak Torque RPM→Max RPM band — leave blank to ignore. 100% lands the
                    1st→2nd shift at Peak Torque RPM (the default); lower values pull it up
                    toward redline, making 1st gear taller.
                  </div>
                </React.Fragment>}
              </div>
              <NumField label="Spacing Curve Bias" value={tightnessBias} onChange={setTightnessBias}
                min={-100} max={100} step={1}
                unit="-100 tightens gears above 1st · 0 linear · +100 widens gears below top"
                hint="Reshapes how RPM drops change shift-to-shift, between the 1st→2nd and last shift's fixed landing points — it doesn't touch either endpoint. Leave at 0 unless a specific gear needs to feel tighter or wider."/>
          </Sec>
        </div>

        <div className="main-content">
        <div className="wrap">
          {result.error?
            <div className="card"><div className="cb err">{result.error}</div></div>
          :<React.Fragment>
            <div className="card">
              <div className="ch">Gear Ladder</div>
              <div className="cb">
                <GearChart gears={result.gears} shifts={result.shifts} maxRpm={maxRpm}
                  peakHpRpm={peakHpRpm} peakTorqueRpm={peakTorqueRpm} metricUnits={metricUnits}/>
              </div>
            </div>

            <div className="card">
              <div className="ch">Gearing</div>
              <div className="cb">
                <div className="hint">
                  Solved to hit {dispSpeed(topSpeed)} at redline in top gear
                  {target1stMode==='mph'&&target1stSpeed!=null&&<React.Fragment> and {dispSpeed(target1stSpeed)} in 1st gear</React.Fragment>}.
                </div>
                {result.topSpeedOverridden&&
                  <div className="hint" style={{marginTop:4}}>
                    Top Gear Ratio is manually overridden — top gear reaches {dispSpeed(result.actualTopSpeed)}
                    {' '}instead of the {dispSpeed(topSpeed)} target. Expected — that's now under your control, not a solve failure.
                  </div>}
                {(result.topSpeedMissed||result.firstGearMissed)&&(()=>{
                  const fit=maxFittingGears(solveArgs);
                  return <div className="warn">
                    {fit!=null&&<div style={{marginBottom:6}}>
                      <b>{gearCount} gears don't fit Forza's limits for this engine and top speed. The most that fit is {fit}.</b>
                      {' '}<button className="tbtn" style={{marginLeft:4}} onClick={()=>setGearCount(fit)}>USE {fit} GEARS</button>
                    </div>}
                    Couldn't fit every ratio inside Forza's {GEAR_RATIO_MIN.toFixed(2)}–{GEAR_RATIO_MAX.toFixed(2)}
                    {' '}gear ratio and {FINAL_DRIVE_MIN.toFixed(2)}–{FINAL_DRIVE_MAX.toFixed(2)} Final Drive ranges
                    {' '}while hitting every target:
                    {result.topSpeedMissed&&
                      <div>Top gear reaches {dispSpeed(result.actualTopSpeed)} instead of {dispSpeed(topSpeed)}.</div>}
                    {result.firstGearMissed&&
                      <div>1st gear reaches {dispSpeed(result.actualFirstGearSpeed)} instead of {dispSpeed(target1stSpeed)}.</div>}
                    {result.topSpeedMissed&&result.actualTopSpeed>topSpeed&&
                      <div>Top gear is too tall, so the car will likely run out of power before redline and the last shift barely drops the revs.</div>}
                    {fit==null&&'Try a different target speed, gear count, or tire radius.'}
                  </div>;
                })()}
                <div className="grows" style={{marginTop:10}}>
                  <div className="grow">
                    <div className="grow-label">FD</div>
                    <div className="grow-shift"/>
                    <div className="grow-speed"/>
                    <div className="grow-ratio"><span className="rv">{round(result.finalDrive,2).toFixed(2)}</span></div>
                  </div>
                  {result.gears.map(g=>{
                    const isTop=g.gear===result.gears.length;
                    const shift=g.gear>=2?result.shifts[g.gear-2]:null;
                    return (
                      <div key={g.gear} className={`grow${isTop?' top':''}`}>
                        <div className="grow-label">Gear {g.gear}{isTop&&<span className="tag">TOP</span>}</div>
                        <div className="grow-shift">
                          {shift&&<React.Fragment>
                            <span className="rl" style={{whiteSpace:'nowrap'}}>{Math.round(shift.landingRpm)} rpm</span>
                            <span className="pbar"><span className="pbar-fill" style={{width:clamp(round(shift.powerBandPct,0),0,100)+'%'}}/></span>
                            <span className="ru" style={{marginLeft:0,whiteSpace:'nowrap',...(shift.powerBandPct>100.5||shift.powerBandPct<-0.5?{color:'#f59e0b'}:{})}}
                              title={shift.powerBandPct>100.5?'Lands below Peak Torque RPM':shift.powerBandPct<-0.5?'Lands above Max RPM':undefined}>{round(shift.powerBandPct,0)}%</span>
                          </React.Fragment>}
                        </div>
                        <div className="grow-speed">{dispSpeed(g.speedAtRedline)}</div>
                        <div className="grow-ratio"><span className={isTop?'rv':'rv-sm'}>{g.ratio.toFixed(2)}</span></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </React.Fragment>}
        </div>
      </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  render(){
    if(this.state.error){
      return <div className="err">GEAR.OS crashed: {String(this.state.error.message||this.state.error)}</div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
<script>
(function(){
  var preload=document.getElementById('pre-load');
  function showError(msg,detail){
    if(preload){
      preload.style.display='block';
      preload.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">GEAR.OS — Failed to load</div>'
        +'<div style="color:#6b7280;margin-bottom:12px">'+msg+'</div>'
        +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6;font-size:11px">'+(detail||'')+'</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
    }
  }
  try{
    if(typeof Babel==='undefined'){showError('Babel failed to load','Check your internet connection and reload.');return;}
    var src=document.getElementById('app-source').textContent;
    var compiled;
    try{
      compiled=Babel.transform(src,{
        presets:['env','react'],
        plugins:['transform-optional-chaining','transform-nullish-coalescing-operator','transform-logical-assignment-operators'],
        filename:'gear-os.jsx'
      }).code;
    }catch(e){
      showError('Babel compilation failed',e.message||String(e));
      return;
    }
    // Use indirect eval so errors are catchable on all browsers including iOS WebKit.
    try{
      (0,eval)(compiled);
    }catch(e){
      showError('Runtime error',e.message||String(e));
    }
  }catch(e){
    showError('Load failed',e.message||String(e));
  }
})();
</script>
</body>
</html>
