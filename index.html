<!DOCTYPE html>
<!--
  GEAR.OS — Forza Gear Ratio Calculator
  "Variable Power Band" gearing: interpolates each shift's landing RPM from the
  torque peak (low gears) toward the HP peak (high gears), then back-solves
  ratios from top gear down. See README.md for the full method.
  MIT License
-->

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>GEAR.OS</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font-mono:'JetBrains Mono','Courier New',monospace;}
html{height:100%;height:-webkit-fill-available;height:100dvh;}
body{background:#020617;color:#cbd5e1;font-family:var(--font-mono);height:100%;
     -webkit-text-size-adjust:100%;overflow:hidden;}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0f1a}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.app-shell{display:flex;flex-direction:column;height:100dvh;min-height:-webkit-fill-available;overflow:hidden}
.topbar{border-bottom:1px solid #0f172a;background:#020617;flex-shrink:0}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;height:48px;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;padding:8px 0}
.brand b{font-size:16px;letter-spacing:3px;color:#e2e8f0;font-weight:700}
.brand span{font-size:11px;color:#6b7280}
.unit-toggle{display:flex;gap:3px}
.share-panel{border-bottom:1px solid #0f172a;background:#030a1a;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.share-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:1400px;width:100%;margin:0 auto}
.share-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:#6b7280;width:80px}
.share-input{flex:1;min-width:0;background:#020617;border:1px solid #1e293b;border-radius:2px;color:#e2e8f0;
    font-family:var(--font-mono);font-size:12px;padding:5px 8px}
.share-note{font-family:var(--font-mono);font-size:10px;color:#6b7280;max-width:1400px;width:100%;margin:0 auto}
.tbtn:disabled{opacity:.4;cursor:default}
.pick-box{display:flex;flex-direction:column;gap:6px;max-width:1400px;width:100%;margin:0 auto;
    border:1px solid #1e293b;border-radius:2px;padding:8px}
.pick-part{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;cursor:pointer;
    font-family:var(--font-mono);font-size:11px;color:#6b7280;padding:4px 6px;border-radius:2px;
    border:1px solid transparent}
.pick-part.on{border-color:#e2e8f033;background:#0f172a}
.pick-part input{accent-color:#4ade80;width:14px;height:14px;flex:none;align-self:center}
.pick-part b{color:#e2e8f0;font-weight:600;letter-spacing:1px;min-width:78px}
.pick-part em{font-style:normal;font-size:9px;letter-spacing:1px;color:#475569}
.garage-list{display:flex;flex-direction:column;gap:4px;max-width:1400px;width:100%;margin:0 auto;max-height:240px;overflow-y:auto}
.garage-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid #0f172a;border-radius:2px;padding:6px 8px}
.garage-item.current{border-color:#e2e8f033;background:#0f172a}
.garage-info{flex:1;min-width:160px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px;color:#6b7280}
.garage-info b{color:#e2e8f0;font-weight:600;overflow-wrap:anywhere}
.garage-tag{font-size:9px;letter-spacing:1px;color:#4ade80}
.garage-actions{display:flex;gap:4px}
@media(max-width:560px){.share-label{width:100%}.share-input{flex-basis:100%}}
.tbtn{padding:4px 10px;border:1px solid #1e293b;background:transparent;color:#6b7280;
    border-radius:2px;cursor:pointer;font-family:var(--font-mono);font-size:11px;
    letter-spacing:1px;transition:all .12s;-webkit-tap-highlight-color:transparent}
.tbtn.on{border-color:#e2e8f044;background:#0f172a;color:#e2e8f0}
.hamburger{background:none;border:1px solid #1e293b;border-radius:2px;color:#94a3b8;
    cursor:pointer;padding:3px 7px;font-size:13px;line-height:1;
    transition:color .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
.hamburger.on{color:#e2e8f0;border-color:#e2e8f033}
.body-shell{display:flex;flex:1;overflow:hidden;position:relative}
.backdrop{position:absolute;inset:0;background:#00000088;z-index:150;transition:opacity .2s ease}
.sidebar{flex-shrink:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    border-right:1px solid #0f172a;background:#020617;transition:width .2s ease}
.sidebar.mobile{position:absolute;top:0;left:0;bottom:0;z-index:200;
    transition:transform .2s ease;box-shadow:4px 0 24px #000000cc}
.sidebar::-webkit-scrollbar{width:12px}
.sidebar::-webkit-scrollbar-track{background:#0a0f1a;border-left:1px solid #0f172a}
.sidebar::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px;border:3px solid #0a0f1a}
.sidebar::-webkit-scrollbar-thumb:hover{background:#334155}
.sections-row{display:flex;justify-content:flex-end;align-items:center;gap:3px;
    padding:5px 12px 4px;border-bottom:1px solid #0f172a}
.sections-row span{font-size:10px;color:#94a3b8;letter-spacing:1px;margin-right:4px}
.stog{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;background:none;border:none;border-bottom:1px solid #0f172a;
    color:#6b7280;cursor:pointer;font-family:var(--font-mono);font-size:11px;
    letter-spacing:2px;text-transform:uppercase;transition:color .12s,background .12s;
    -webkit-tap-highlight-color:transparent}
.stog:hover{color:#9ca3af;background:#0a0f1a88}
.stog-open{color:#9ca3af}
.sec{border-bottom:1px solid #0f172a}
.sec-body{padding:8px 12px 10px}
.main-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1400px;margin:0 auto;padding:24px}
@media(max-width:768px){.wrap{padding:16px}.topbar-inner{height:auto;padding:8px 16px}}
/* Phones: the subtitle is what wrapped the top bar to 3 rows at 320px. */
@media(max-width:600px){.brand span{display:none}.brand{padding:4px 0}.brand b{letter-spacing:2px}.tbtn{padding:4px 7px;letter-spacing:.5px}.topbar-inner{padding:8px 10px}}
/* iOS zooms the page when a focused field's text is under 16px. */
@media(max-width:767px){input.finput,input.share-input{font-size:16px}}
/* Touch: ~36px targets without changing the desktop look. The AUTO toggle
   gets its padding cancelled by a matching negative margin so the row layout
   doesn't move. */
@media(pointer:coarse){
  .tbtn{min-height:36px;min-width:36px}
  .hamburger{min-height:36px;min-width:36px}
  .stog{padding:13px 12px}
  .field .auto-tog{padding:10px 8px;margin:-10px -8px}
  .field .auto-tog input{width:18px;height:18px}
  .sli::-webkit-slider-thumb{width:20px;height:20px;margin-top:-8.5px}
  .sli::-moz-range-thumb{width:20px;height:20px}
}
.card{background:#020617;border:1px solid #1e293b;border-radius:2px;overflow:hidden;margin-bottom:16px}
.ch{padding:6px 10px;background:#0a0f1a;border-bottom:1px solid #1e293b;
    font-size:10px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase}
.cb{padding:12px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}

.field .auto-tog{text-transform:none;letter-spacing:0;font-size:10px;color:#6b7280;
    cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
.field .auto-tog input{cursor:pointer}
.finput{width:100%;background:#0a0f1a;border:1px solid #1e293b;border-radius:2px;

    transition:border-color .12s}
.finput:focus{border-color:#e2e8f055}
.finput:disabled{color:#6b7280;background:#080b12}
.sli{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:1.5px;
     outline:none;margin-top:8px;cursor:pointer;display:block;border:none;padding:10px 0;
     box-sizing:content-box;background-clip:content-box}

.sli::-webkit-slider-thumb:hover{transform:scale(1.2)}
.sli::-moz-range-thumb{width:14px;height:14px;background:#e2e8f0;border-radius:50%;border:none;
  cursor:pointer;box-shadow:0 0 0 2px #02061799}
.sli:disabled{cursor:not-allowed;opacity:.4}
.hint{font-size:10px;color:#6b7280;margin-top:4px}
.ro{padding:10px 12px;background:#0f172a;border:1px solid #1e293b;border-radius:2px;
    display:flex;justify-content:space-between;align-items:baseline}
.rl{font-size:10px;color:#9ca3af;letter-spacing:1px;text-transform:uppercase}
.rv{font-size:22px;font-weight:700;color:#e2e8f0}
.rv-sm{font-size:18px;font-weight:700;color:#e2e8f0}
.ru{font-size:10px;color:#6b7280;margin-left:4px}
.tag{font-size:9px;color:#94a3b8;background:#020617;border:1px solid #1e293b;border-radius:2px;
    padding:1px 5px;letter-spacing:1px}
.pbar{display:block;flex:1;height:5px;background:#020617;border-radius:2px;overflow:hidden}
.pbar-fill{display:block;height:100%;background:#e2e8f0}
.grows{display:flex;flex-direction:column;gap:6px;container-type:inline-size}
.grow{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#0f172a;
    border:1px solid #1e293b;border-radius:2px}
.grow.top{border-color:#e2e8f033}
.grow-label{flex:0 0 92px;font-size:11px;color:#9ca3af;letter-spacing:1px;
    text-transform:uppercase;display:flex;align-items:center;gap:6px}
.grow-shift{flex:1 1 160px;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.grow-speed{flex:0 0 116px;font-size:12px;color:#cbd5e1;text-align:right;white-space:nowrap}
.grow-ratio{flex:0 0 96px;text-align:right}
/* Row width is driven by the sidebar taking space, not just viewport width
   (e.g. tablet-width screens with the sidebar open squeeze this to ~390px
   well before any viewport breakpoint fires) — a container query keyed to
   .grows' own rendered width catches that; a plain media query can't. */
@container (max-width:540px){
  .grow{flex-wrap:wrap}
  .grow-shift{flex:1 1 100%;order:4;overflow:visible}
}
.warn{color:#f59e0b;font-size:11px;padding:8px 10px;background:#1c1408;
    border:1px solid #78350f;border-radius:2px;margin:10px 12px 0}
.err{color:#f87171;font-size:12px;padding:16px;}
</style>
</head>
<body>
<div id="root">
  <!-- Shown only if React fails to mount -->
  <div id="pre-load" style="padding:24px;color:#6b7280;font-family:var(--font-mono);font-size:12px;background:#020617;min-height:100vh">
    <div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">GEAR.OS</div>
    <div style="margin-bottom:16px">Loading...</div>
  </div>
</div>
<script>
// Global error catcher — fires before React/Babel, shows error on blank screen
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('pre-load');
  if(d){
    d.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">GEAR.OS — Failed to load</div>'
      +'<div style="color:#6b7280;margin-bottom:12px">JavaScript error on line '+line+'</div>'
      +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6">'+(msg||'Unknown error')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
  }
};
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var d=document.getElementById('pre-load');
    if(d&&d.innerHTML.indexOf('Loading')>-1)d.style.display='none';
  },5000);
});
</script>
<script id="app-source" type="text/plain">
const {useState,useMemo,useRef,useEffect}=React;

// ---- Forza ratio limits ----
// Confirmed in-game (Race transmission, sliders dragged to their stops).
const GEAR_RATIO_MIN=0.48, GEAR_RATIO_MAX=6.00;
const FINAL_DRIVE_MIN=2.20, FINAL_DRIVE_MAX=6.10;

const MM_PER_MILE=1609344; // 63360 in/mi * 25.4 mm/in
const MM_PER_IN=25.4;
const KMH_PER_MPH=1.60934;

function round(n,d){const m=Math.pow(10,d||0);return Math.round(n*m)/m;}
function clamp(n,lo,hi){return Math.min(hi,Math.max(lo,n));}

// Ported from SUSP.OS (same formula, same tolerant parsing) so a tire size
// like "255/40R19" fills the same geometric radius SUSP.OS would show. This
// is a starting point, not gospel — Forza's actual rolling radius has been
// observed to differ from this static sidewall geometry by anywhere from
// ~+1% to -10% depending on the car, likely because Forza's own Top Speed
// stat is a real power/drag-limited simulation result, not a pure redline×
// gearing calculation. Verify against that stat and nudge Tire Radius below
// if needed — don't treat the auto-filled number as final.
const parseTyre=str=>{
  const s=String(str??'').trim();
  if(!s)return null;
  const tokens=s.match(/\d+(?:\.\d+)?/g);
  if(!tokens||!tokens.length)return null;
  const width=+tokens[0];
  if(!(width>=50&&width<=500))return null;
  if(tokens.length===1)return{width,aspectRatio:null,rimDiameter:null,diameter:null,radius:null};
  const aspect=+tokens[1];
  if(!(aspect>=10&&aspect<=100))return null;
  if(tokens.length===2)return{width,aspectRatio:aspect,rimDiameter:null,diameter:null,radius:null};
  const rim=+tokens[2];
  if(!(rim>=8&&rim<=30))return null;
  const diameter=rim*25.4+2*(width*aspect/100);
  return{width,aspectRatio:aspect,rimDiameter:rim,diameter,radius:diameter/2};
};

// ---- Share codes ----
// Sparse `id:value` list, '|'-joined, URL-safe Base64, led by the codec
// version. Only fields that differ from DEFAULT_INPUTS are written, and
// missing fields decode to defaults, so old codes keep working when fields
// are added. IDS ARE PERMANENT: never reuse one, retire it instead.
// See docs/CODEC.md. View prefs (units, dyno scale) are deliberately not shared.
const DEFAULT_INPUTS={
  maxRpm:8000,autoHp:true,hpRpm:7200,autoTorque:true,torqueRpm:5200,
  gearCount:6,topSpeed:180,tireRadius:330,tireSize:'',tireInputMode:'size',
  topGearOverride:null,target1stSpeed:null,target1stPct:null,target1stMode:'mph',
  tightnessBias:0,
};
const CODEC_VERSION=1;
const CODEC_FIELDS=[
  {id:1,key:'maxRpm',type:'num',min:1000,max:20000},
  {id:2,key:'autoHp',type:'bool'},
  {id:3,key:'hpRpm',type:'num',min:500,max:20000},
  {id:4,key:'autoTorque',type:'bool'},
  {id:5,key:'torqueRpm',type:'num',min:500,max:20000},
  {id:6,key:'gearCount',type:'int',min:2,max:10},
  {id:7,key:'topSpeed',type:'num',min:1,max:600},        // mph
  {id:8,key:'tireRadius',type:'num',min:50,max:1000},    // mm
  {id:9,key:'tireSize',type:'str',maxLen:24},
  {id:10,key:'tireInputMode',type:'enum',values:['size','radius']},
  {id:11,key:'topGearOverride',type:'num',nullable:true,min:0.48,max:6},
  {id:12,key:'target1stSpeed',type:'num',nullable:true,min:1,max:600}, // mph
  {id:13,key:'target1stPct',type:'num',nullable:true,min:0,max:100},
  {id:14,key:'target1stMode',type:'enum',values:['mph','pct']},
  {id:15,key:'tightnessBias',type:'num',min:-100,max:100},
  // Retired, never reuse: (none)
];
const codecEnc=(f,v)=>{
  if(v==null)return 'n';
  if(f.type==='bool')return v?'1':'0';
  if(f.type==='enum')return String(f.values.indexOf(v));
  if(f.type==='str')return encodeURIComponent(v);
  return String(round(v,4));
};
// Sanitized value, or undefined when the raw text is unusable (caller keeps the default).
const codecDec=(f,raw)=>{
  if(raw==='n')return f.nullable?null:undefined;
  if(f.type==='bool')return raw==='1'?true:raw==='0'?false:undefined;
  if(f.type==='enum')return f.values[Number(raw)];
  if(f.type==='str'){try{return decodeURIComponent(raw).slice(0,f.maxLen);}catch(e){return undefined;}}
  const n=Number(raw);
  if(raw===''||!Number.isFinite(n))return undefined;
  const c=clamp(n,f.min,f.max);
  return f.type==='int'?Math.round(c):c;
};
function encodeInputs(inputs){
  const parts=[CODEC_VERSION];
  for(const f of CODEC_FIELDS){
    const enc=codecEnc(f,inputs[f.key]===undefined?DEFAULT_INPUTS[f.key]:inputs[f.key]);
    if(enc===codecEnc(f,DEFAULT_INPUTS[f.key]))continue;
    parts.push(`${f.id}:${enc}`);
  }
  // URL-safe so a code can ride in a link's #hash untouched.
  return btoa(parts.join('|')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
// Accepts a bare code or a full share link. Throws with a user-facing message.
function decodeInputs(code){
  let text;
  try{
    const b=String(code??'').trim().replace(/^.*#g=/,'').replace(/-/g,'+').replace(/_/g,'/');
    text=atob(b+'==='.slice((b.length+3)%4));
  }catch(e){throw new Error('Not a GEAR.OS code.');}
  const parts=text.split('|');
  const version=Number(parts[0]);
  if(!Number.isInteger(version)||version<1)throw new Error('Not a GEAR.OS code.');
  if(version>CODEC_VERSION)throw new Error('This code is from a newer GEAR.OS. Reload the page and try again.');
  const out={...DEFAULT_INPUTS};
  for(let i=1;i<parts.length;i++){
    const ci=parts[i].indexOf(':');
    if(ci<0)continue;
    const f=CODEC_FIELDS.find(x=>x.id===Number(parts[i].slice(0,ci)));
    if(!f)continue; // unknown id (newer app version), ignored
    const v=codecDec(f,parts[i].slice(ci+1));
    if(v!==undefined)out[f.key]=v;
  }
  return out;
}

// ---- Share parts ----
// A loaded code can be applied in pieces, so someone can take a friend's
// engine without losing their own gearbox. Every DEFAULT_INPUTS key belongs
// to exactly one part (guarded by tests) - a new input must be added here too.
const SHARE_PARTS=[
  {id:'engine',label:'ENGINE',keys:['maxRpm','autoHp','hpRpm','autoTorque','torqueRpm']},
  {id:'topSpeed',label:'DESIRED TOP SPEED',keys:['topSpeed']},
  {id:'gearbox',label:'GEARBOX',keys:['gearCount','tireRadius','tireSize','tireInputMode',
    'topGearOverride','target1stSpeed','target1stPct','target1stMode','tightnessBias']},
];
// Current inputs with only the selected parts taken from the decoded code.
// `parts` is a {partId:bool} map; an empty or missing map changes nothing.
function mergeInputs(current,incoming,parts){
  const out={...current};
  for(const p of SHARE_PARTS){
    if(!parts||!parts[p.id])continue;
    for(const k of p.keys)out[k]=incoming[k];
  }
  return out;
}
// True when a part of the incoming code differs from what is loaded now, so
// the UI can mark which parts actually carry a change.
function partDiffers(current,incoming,partId){
  const p=SHARE_PARTS.find(x=>x.id===partId);
  if(!p)return false;
  return p.keys.some(k=>current[k]!==incoming[k]);
}

// ---- Garage ----
// Named saves, each stored as a share code, so saves get the codec's
// versioning, defaults and sanitizing for free. Names are unique
// (case-insensitive); saving under an existing name replaces it.
// Newest first. See docs/PERSISTENCE.md.
const GARAGE_KEY='gearos_garage_v1';
const GARAGE_NAME_MAX=40;
const CODE_RE=/^[A-Za-z0-9_-]+$/;
const garageKey=n=>n.trim().toLowerCase();
// Accepts parsed JSON (an array, or a backup object {garage:[...]}) and
// returns a clean list. Drops malformed entries, de-dupes names (keeps newest).
function sanitizeGarage(data){
  const arr=Array.isArray(data)?data:Array.isArray(data?.garage)?data.garage:[];
  const byName=new Map();
  for(const e of arr){
    if(!e||typeof e.name!=='string'||typeof e.code!=='string')continue;
    const name=e.name.trim().slice(0,GARAGE_NAME_MAX);
    if(!name||!CODE_RE.test(e.code))continue;
    const savedAt=Number.isFinite(e.savedAt)?e.savedAt:0;
    const prev=byName.get(garageKey(name));
    if(!prev||savedAt>=prev.savedAt)byName.set(garageKey(name),{name,code:e.code,savedAt});
  }
  return [...byName.values()].sort((x,y)=>y.savedAt-x.savedAt);
}
function garageUpsert(list,name,code,now){
  const n=String(name??'').trim().slice(0,GARAGE_NAME_MAX);
  if(!n)return list;
  return [{name:n,code,savedAt:now},...list.filter(e=>garageKey(e.name)!==garageKey(n))];
}
function garageRemove(list,name){
  return list.filter(e=>garageKey(e.name)!==garageKey(name));
}
// Restore merges a backup into the current garage. On a name clash the newer save wins.
function garageMerge(list,incoming){
  return sanitizeGarage([...list,...sanitizeGarage(incoming)]);
}
function loadGarage(){
  try{const s=localStorage.getItem(GARAGE_KEY);return s?sanitizeGarage(JSON.parse(s)):[];}
