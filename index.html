<!DOCTYPE html>
<!--
  GEAR.OS — Forza Gear Ratio Calculator
  "Variable Power Band" gearing: interpolates each shift's landing RPM from the
  torque peak (low gears) toward the HP peak (high gears), then back-solves
  ratios from top gear down. See README.md for the full method.
  MIT License
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>GEAR.OS</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font-mono:'JetBrains Mono','Courier New',monospace;}
html{height:100%;height:-webkit-fill-available;height:100dvh;}
body{background:#020617;color:#cbd5e1;font-family:var(--font-mono);min-height:100%;
     -webkit-text-size-adjust:100%;}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0f1a}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.topbar{border-bottom:1px solid #0f172a;background:#020617}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;height:48px;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;padding:8px 0}
.brand b{font-size:16px;letter-spacing:3px;color:#e2e8f0;font-weight:700}
.brand span{font-size:11px;color:#6b7280}
.unit-toggle{display:flex;gap:3px}
.tbtn{padding:4px 10px;border:1px solid #1e293b;background:transparent;color:#6b7280;
    border-radius:2px;cursor:pointer;font-family:var(--font-mono);font-size:11px;
    letter-spacing:1px;transition:all .12s;-webkit-tap-highlight-color:transparent}
.tbtn.on{border-color:#e2e8f044;background:#0f172a;color:#e2e8f0}
.wrap{max-width:1400px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media(max-width:768px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.topbar-inner{height:auto;padding:10px 16px}}
.card{background:#020617;border:1px solid #1e293b;border-radius:2px;overflow:hidden;margin-bottom:16px}
.ch{padding:6px 10px;background:#0a0f1a;border-bottom:1px solid #1e293b;
    font-size:10px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase}
.cb{padding:12px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:flex;justify-content:space-between;align-items:center;
    font-size:10px;color:#9ca3af;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.field label .auto-tog{text-transform:none;letter-spacing:0;font-size:10px;color:#6b7280;
    cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
.field label .auto-tog input{cursor:pointer}
.finput{width:100%;background:#0a0f1a;border:1px solid #1e293b;border-radius:2px;
    color:#e2e8f0;font-family:var(--font-mono);font-size:14px;padding:7px 8px;outline:none;
    transition:border-color .12s}
.finput:focus{border-color:#e2e8f055}
.finput:disabled{color:#6b7280;background:#080b12}
.sli{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:1.5px;
     outline:none;margin-top:8px;cursor:pointer;display:block;border:none;padding:10px 0;
     box-sizing:content-box;background-clip:content-box}
.sli::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#e2e8f0;
  border-radius:50%;cursor:pointer;margin-top:-5.5px;transition:transform .15s;
  box-shadow:0 0 0 2px #02061799}
.sli::-webkit-slider-thumb:hover{transform:scale(1.2)}
.sli::-moz-range-thumb{width:14px;height:14px;background:#e2e8f0;border-radius:50%;border:none;
  cursor:pointer;box-shadow:0 0 0 2px #02061799}
.sli:disabled{cursor:not-allowed;opacity:.4}
.hint{font-size:10px;color:#6b7280;margin-top:4px}
.ro{padding:10px 12px;background:#0f172a;border:1px solid #1e293b;border-radius:2px;
    display:flex;justify-content:space-between;align-items:baseline}
.ro-col{display:block}
.ro-col.top{border-color:#e2e8f033}
.ro-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.rl{font-size:10px;color:#9ca3af;letter-spacing:1px;text-transform:uppercase}
.rv{font-size:22px;font-weight:700;color:#e2e8f0}
.rv-sm{font-size:18px;font-weight:700;color:#e2e8f0}
.ru{font-size:10px;color:#6b7280;margin-left:4px}
.tag{font-size:9px;color:#94a3b8;background:#020617;border:1px solid #1e293b;border-radius:2px;
    padding:1px 5px;letter-spacing:1px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pbar{display:block;flex:1;height:5px;background:#020617;border-radius:2px;overflow:hidden}
.pbar-fill{display:block;height:100%;background:#e2e8f0}
.warn{color:#f59e0b;font-size:11px;padding:8px 10px;background:#1c1408;
    border:1px solid #78350f;border-radius:2px;margin:10px 12px 0}
.err{color:#f87171;font-size:12px;padding:16px;}
</style>
</head>
<body>
<div id="root">
  <!-- Shown only if React fails to mount -->
  <div id="pre-load" style="padding:24px;color:#6b7280;font-family:var(--font-mono);font-size:12px;background:#020617;min-height:100vh">
    <div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">GEAR.OS</div>
    <div style="margin-bottom:16px">Loading...</div>
  </div>
</div>
<script>
// Global error catcher — fires before React/Babel, shows error on blank screen
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('pre-load');
  if(d){
    d.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">GEAR.OS — Failed to load</div>'
      +'<div style="color:#6b7280;margin-bottom:12px">JavaScript error on line '+line+'</div>'
      +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6">'+(msg||'Unknown error')+'</div>'
      +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
  }
};
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var d=document.getElementById('pre-load');
    if(d&&d.innerHTML.indexOf('Loading')>-1)d.style.display='none';
  },5000);
});
</script>
<script id="app-source" type="text/plain">
const {useState,useMemo}=React;

// ---- Forza ratio limits ----
// Confirmed in-game (Race transmission, sliders dragged to their stops).
const GEAR_RATIO_MIN=0.48, GEAR_RATIO_MAX=6.00;
const FINAL_DRIVE_MIN=2.20, FINAL_DRIVE_MAX=6.10;

const MM_PER_MILE=1609344; // 63360 in/mi * 25.4 mm/in
const MM_PER_IN=25.4;
const KMH_PER_MPH=1.60934;

function round(n,d){const m=Math.pow(10,d||0);return Math.round(n*m)/m;}
function clamp(n,lo,hi){return Math.min(hi,Math.max(lo,n));}

// mph = Engine_RPM * 2*pi * TireRadius(mm) * 60 / (1609344 * Ratio * FinalDrive)
// (wheel RPM = engine RPM / (ratio*FD); wheel circumference = 2*pi*r; convert mm/min -> mph)
function speedAtRpm(rpm,ratio,finalDrive,tireRadius){
  return rpm*2*Math.PI*tireRadius*60/(MM_PER_MILE*ratio*finalDrive);
}

function computeGearing({maxRpm,peakHpRpm,peakTorqueRpm,gearCount,topSpeedMph,tireRadius,target1stMph}){
  const N=gearCount;
  if(!(N>=2&&N<=10))return {error:'Gear count must be between 2 and 10.'};
  if(!(maxRpm>0))return {error:'Max RPM must be positive.'};
  if(!(topSpeedMph>0))return {error:'Desired top speed must be positive.'};
  if(!(tireRadius>0))return {error:'Tire radius must be positive.'};
  if(target1stMph!=null&&!(target1stMph>0))return {error:'Target 1st gear speed must be positive.'};
  if(!(peakTorqueRpm>0&&peakHpRpm>peakTorqueRpm&&maxRpm>=peakHpRpm)){
    return {error:'RPMs must satisfy 0 < Peak Torque RPM < Peak HP RPM ≤ Max RPM.'};
  }

  // Target landing RPM for each shift g -> g+1 (g = 1..N-1), interpolated linearly
  // from the torque peak (first shift) to the HP peak (last shift).
  const landingRpm=new Array(N+1).fill(0);
  for(let g=1;g<N;g++){
    const t=(N===2)?1:(g-1)/(N-2);
    landingRpm[g]=peakTorqueRpm+t*(peakHpRpm-peakTorqueRpm);
  }

  // Back-solve ratios from top gear (arbitrarily set to 1.00) down to 1st.
  // Scale-invariant: only the ratio *between* gears matters here, so the
  // absolute scale (and therefore Final Drive) can be fixed independently below.
  const rawRatio=new Array(N+1).fill(0);
  rawRatio[N]=1.00;
  for(let g=N-1;g>=1;g--){
    rawRatio[g]=rawRatio[g+1]*(maxRpm/landingRpm[g]);
  }

  // Solve Final Drive so the anchor gear hits its target speed at Max RPM.
  // Normally that's top gear hitting Desired Top Speed; if a Target 1st Gear
  // Speed is set, it takes over as the anchor instead (1st gear's speed and
  // top gear's speed can't both be chosen independently — their ratio is
  // already fixed by the RPM interpolation above — so one has to give).
  const anchorIsFirstGear=target1stMph!=null;
  const anchorSpeedMph=anchorIsFirstGear?target1stMph:topSpeedMph;
  const anchorRawRatio=anchorIsFirstGear?rawRatio[1]:rawRatio[N];
  const fdRaw=maxRpm*2*Math.PI*tireRadius*60/(MM_PER_MILE*anchorRawRatio*anchorSpeedMph);

  // Normalize: find a uniform scale s (ratio[g]*=s, FD/=s) that fits both the
  // per-gear range and the Final Drive range. This is safe because the product
  // ratio*FD (and thus every RPM/speed relationship) is invariant under it.
  const sMax=Math.min(GEAR_RATIO_MAX/rawRatio[1],fdRaw/FINAL_DRIVE_MIN);
  const sMin=Math.max(GEAR_RATIO_MIN/rawRatio[N],fdRaw/FINAL_DRIVE_MAX);
  let feasible=true, s=1;
  if(sMin<=sMax){
    s=clamp(1,sMin,sMax);
  }else{
    feasible=false;
    s=clamp(1,GEAR_RATIO_MIN/rawRatio[N],GEAR_RATIO_MAX/rawRatio[1]);
  }

  const finalDrive=clamp(fdRaw/s,FINAL_DRIVE_MIN,FINAL_DRIVE_MAX);
  const gears=[];
  for(let g=1;g<=N;g++){
    const ratio=clamp(rawRatio[g]*s,GEAR_RATIO_MIN,GEAR_RATIO_MAX);
    gears.push({gear:g,ratio,speedAtRedline:speedAtRpm(maxRpm,ratio,finalDrive,tireRadius)});
  }

  // Whichever of Final Drive or a gear ratio hit its range limit, the real
  // signal for the user is whether the anchor gear still reaches its target
  // speed at redline — check that directly rather than trusting `feasible`.
  const actualTopSpeed=gears[N-1].speedAtRedline;
  const actualAnchorSpeed=anchorIsFirstGear?gears[0].speedAtRedline:actualTopSpeed;
  const anchorMissed=Math.abs(actualAnchorSpeed-anchorSpeedMph)>Math.max(0.5,anchorSpeedMph*0.01);

  // % of the power band (Peak Torque RPM -> Max RPM) still ahead of the landing
  // point — i.e. how much of it the next gear actually gets to use. Landing at
  // the torque peak (low gears) uses the full band (100%); landing near
  // redline (high gears) leaves little band left to use (low %).
  const shifts=[];
  for(let g=1;g<N;g++){
    const pct=clamp((maxRpm-landingRpm[g])/(maxRpm-peakTorqueRpm)*100,0,100);
    shifts.push({from:g,to:g+1,landingRpm:landingRpm[g],powerBandPct:pct});
  }

  return {finalDrive,gears,shifts,feasible:!anchorMissed,actualTopSpeed,actualAnchorSpeed,
    anchorIsFirstGear,anchorSpeedMph,peakHpRpm,peakTorqueRpm};
}

function NumField({label,value,onChange,autoValue,auto,onAutoChange,min,max,step,unit}){
  const dispVal=auto?round(autoValue,0):value;
  const pct=max>min?clamp((dispVal-min)/(max-min)*100,0,100):0;
  return (
    <div className="field">
      <label>
        <span>{label}</span>
        {onAutoChange&&
          <span className="auto-tog" onClick={()=>onAutoChange(!auto)}>
            <input type="checkbox" checked={auto} onChange={()=>onAutoChange(!auto)}/>AUTO
          </span>}
      </label>
      <input
        className="finput"
        type="number"
        min={min}
        max={max}
        step={step||1}
        disabled={auto}
        value={dispVal}
        onChange={e=>onChange(Number(e.target.value))}
      />
      {max!=null&&
        <input
          className="sli"
          type="range"
          min={min}
          max={max}
          step={step||1}
          disabled={auto}
          value={clamp(dispVal,min,max)}
          style={{background:`linear-gradient(to right,#e2e8f0 ${pct}%,#1e293b ${pct}%)`}}
          onChange={e=>onChange(Number(e.target.value))}
        />}
      {unit&&<div className="hint">{unit}</div>}
    </div>
  );
}

// Classic RPM-vs-speed sawtooth: each gear rises from its landing RPM to
// redline as speed climbs, then drops back to the next gear's landing RPM
// at that same speed the instant you shift.
function GearChart({gears,shifts,maxRpm,peakHpRpm,peakTorqueRpm,metricUnits}){
  const conv=mph=>metricUnits?mph*KMH_PER_MPH:mph;
  const unit=metricUnits?'km/h':'mph';
  const pts=[[0,0]];
  gears.forEach((g,i)=>{
    pts.push([conv(g.speedAtRedline),maxRpm]);
    const sh=shifts[i];
    if(sh)pts.push([conv(g.speedAtRedline),sh.landingRpm]);
  });
  const W=700,H=260,padL=48,padR=76,padT=14,padB=26;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const xMax=pts[pts.length-1][0]*1.04;
  const yMax=maxRpm*1.05;
  const sx=v=>padL+(v/xMax)*plotW;
  const sy=v=>padT+plotH-(v/yMax)*plotH;
  const polyPts=pts.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  const ticks=[0,0.25,0.5,0.75,1];
  const refLines=[
    {rpm:maxRpm,color:'#ef4444',label:'REDLINE'},
    {rpm:peakHpRpm,color:'#f59e0b',label:'PEAK HP'},
    {rpm:peakTorqueRpm,color:'#38bdf8',label:'PEAK TQ'},
  ];
  return (
    <React.Fragment>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}
           style={{display:'block',background:'#020617',borderRadius:3}}>
        {ticks.map(t=>{
          const y=sy(t*yMax);
          return (
            <React.Fragment key={'y'+t}>
              <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="#0f172a" strokeWidth={1}/>
              <text x={padL-6} y={y+3} textAnchor="end" fontSize={9} fill="#6b7280" fontFamily="JetBrains Mono, monospace">{Math.round(t*yMax)}</text>
            </React.Fragment>
          );
        })}
        {ticks.map(t=>{
          const x=sx(t*xMax);
          return (
            <React.Fragment key={'x'+t}>
              <line x1={x} y1={padT} x2={x} y2={H-padB} stroke="#0f172a" strokeWidth={1}/>
              <text x={x} y={H-padB+14} textAnchor="middle" fontSize={9} fill="#6b7280" fontFamily="JetBrains Mono, monospace">{Math.round(t*xMax)}</text>
            </React.Fragment>
          );
        })}
        {refLines.map(r=>(
          <React.Fragment key={r.label}>
            <line x1={padL} y1={sy(r.rpm)} x2={W-padR} y2={sy(r.rpm)} stroke={r.color} strokeWidth={1} strokeDasharray="4 3" opacity={0.8}/>
            <text x={W-padR+6} y={sy(r.rpm)+3} fontSize={9} fill={r.color} fontFamily="JetBrains Mono, monospace">{r.label}</text>
          </React.Fragment>
        ))}
        <polyline points={polyPts} fill="none" stroke="#e2e8f0" strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map((p,i)=>(
          <circle key={i} cx={sx(p[0])} cy={sy(p[1])} r={3} fill="#e2e8f0"/>
        ))}
      </svg>
      <div className="hint" style={{marginTop:6}}>Speed in {unit} · RPM on the vertical axis</div>
    </React.Fragment>
  );
}

function App(){
  const [metricUnits,setMetricUnits]=useState(false);
  const [maxRpm,setMaxRpm]=useState(8000);
  const [autoHp,setAutoHp]=useState(true);
  const [hpRpm,setHpRpm]=useState(7200);
  const [autoTorque,setAutoTorque]=useState(true);
  const [torqueRpm,setTorqueRpm]=useState(5200);
  const [gearCount,setGearCount]=useState(6);
  const [topSpeed,setTopSpeed]=useState(180); // canonical: mph
  const [tireRadius,setTireRadius]=useState(330); // canonical: mm
  const [target1stSpeed,setTarget1stSpeed]=useState(null); // canonical: mph, null = unset

  const dispSpeed=mph=>metricUnits?`${round(mph*KMH_PER_MPH,1)} km/h`:`${round(mph,1)} mph`;

  const peakHpRpm=autoHp?round(maxRpm*0.90):hpRpm;
  const peakTorqueRpm=autoTorque?round(maxRpm*0.65):torqueRpm;

  const result=useMemo(()=>computeGearing({
    maxRpm,peakHpRpm,peakTorqueRpm,gearCount,topSpeedMph:topSpeed,tireRadius,target1stMph:target1stSpeed
  }),[maxRpm,peakHpRpm,peakTorqueRpm,gearCount,topSpeed,tireRadius,target1stSpeed]);

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <b>GEAR.OS</b>
            <span>Forza Gear Ratio Calculator — Variable Power Band</span>
          </div>
          <div className="unit-toggle">
            <button className={`tbtn${!metricUnits?' on':''}`} onClick={()=>setMetricUnits(false)}>IMP</button>
            <button className={`tbtn${metricUnits?' on':''}`} onClick={()=>setMetricUnits(true)}>MET</button>
          </div>
        </div>
      </div>
      <div className="wrap">
      <div className="grid">
        <div>
          <div className="card">
            <div className="ch">Engine</div>
            <div className="cb">
              <NumField label="Max RPM (Redline)" value={maxRpm} onChange={setMaxRpm} min={4000} max={12000} step={100}/>
              <NumField label="Peak HP RPM" value={hpRpm} onChange={setHpRpm}
                auto={autoHp} onAutoChange={setAutoHp} autoValue={maxRpm*0.90} min={1000} max={maxRpm} step={100}
                unit={autoHp?'Auto: 90% of Max RPM':undefined}/>
              <NumField label="Peak Torque RPM" value={torqueRpm} onChange={setTorqueRpm}
                auto={autoTorque} onAutoChange={setAutoTorque} autoValue={maxRpm*0.65} min={500} max={peakHpRpm} step={100}
                unit={autoTorque?'Auto: 65% of Max RPM':undefined}/>
            </div>
          </div>
          <div className="card">
            <div className="ch">Gearbox &amp; Chassis</div>
            <div className="cb">
              <NumField label="Gear Count" value={gearCount} onChange={setGearCount} min={2} max={10} step={1}/>
              <NumField label="Desired Top Speed"
                value={metricUnits?round(topSpeed*KMH_PER_MPH,0):topSpeed}
                onChange={v=>setTopSpeed(metricUnits?v/KMH_PER_MPH:v)}
                min={metricUnits?round(30*KMH_PER_MPH,0):30}
                max={metricUnits?round(300*KMH_PER_MPH,0):300} step={1}
                unit={metricUnits?'km/h':'mph'}/>
              <NumField label="Tire Radius" value={tireRadius} onChange={setTireRadius} min={125} max={500} step={1} unit="mm (rolling radius)"/>
              <div className="field">
                <label>
                  <span>Target 1st Gear Speed</span>
                  {target1stSpeed!=null&&
                    <span className="auto-tog" onClick={()=>setTarget1stSpeed(null)}>CLEAR</span>}
                </label>
                <input
                  className="finput"
                  type="number"
                  placeholder="Optional"
                  min={metricUnits?round(10*KMH_PER_MPH,0):10}
                  max={metricUnits?round(120*KMH_PER_MPH,0):120}
                  step={1}
                  value={target1stSpeed==null?'':(metricUnits?round(target1stSpeed*KMH_PER_MPH,0):target1stSpeed)}
                  onChange={e=>{
                    const raw=e.target.value;
                    if(raw===''){setTarget1stSpeed(null);return;}
                    const v=Number(raw);
                    setTarget1stSpeed(metricUnits?v/KMH_PER_MPH:v);
                  }}
                />
                <div className="hint">
                  {metricUnits?'km/h':'mph'} — leave blank to gear for Desired Top Speed instead.
                  When set, this replaces Desired Top Speed as the Final Drive target.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div>
          {result.error?
            <div className="card"><div className="cb err">{result.error}</div></div>
          :<React.Fragment>
            <div className="card">
              <div className="ch">Recommended Final Drive</div>
              <div className="cb">
                <div className="ro">
                  <span className="rl">Final Drive</span>
                  <span><span className="rv">{round(result.finalDrive,2).toFixed(2)}</span></span>
                </div>
                <div className="hint" style={{marginTop:8}}>
                  Solved to hit {dispSpeed(result.anchorSpeedMph)} at redline in
                  {' '}{result.anchorIsFirstGear?'1st gear':'top gear'}.
                </div>
              </div>
              {!result.feasible&&
                <div className="warn">
                  Couldn't hit {dispSpeed(result.anchorSpeedMph)} at redline in
                  {' '}{result.anchorIsFirstGear?'1st':'top'} gear within Forza's
                  {' '}{GEAR_RATIO_MIN.toFixed(2)}–{GEAR_RATIO_MAX.toFixed(2)} gear ratio and
                  {' '}{FINAL_DRIVE_MIN.toFixed(2)}–{FINAL_DRIVE_MAX.toFixed(2)} Final Drive ranges —
                  {' '}{result.anchorIsFirstGear?'1st':'top'} gear actually reaches
                  {' '}{dispSpeed(result.actualAnchorSpeed)} at redline instead.
                  Try a different target speed, gear count, or tire radius.
                </div>}
            </div>

            <div className="card">
              <div className="ch">RPM vs Speed</div>
              <div className="cb">
                <GearChart gears={result.gears} shifts={result.shifts} maxRpm={maxRpm}
                  peakHpRpm={peakHpRpm} peakTorqueRpm={peakTorqueRpm} metricUnits={metricUnits}/>
              </div>
            </div>

            <div className="card">
              <div className="ch">Gear Ratios</div>
              <div className="cb">
                <div className="stat-grid">
                  {result.gears.map(g=>{
                    const isTop=g.gear===result.gears.length;
                    return (
                      <div key={g.gear} className={`ro ro-col${isTop?' top':''}`}>
                        <div className="ro-hdr">
                          <span className="rl">Gear {g.gear}</span>
                          {isTop&&<span className="tag">TOP</span>}
                        </div>
                        <div style={{display:'flex',alignItems:'baseline',gap:3}}>
                          <span className={isTop?'rv':'rv-sm'}>{g.ratio.toFixed(2)}</span>
                        </div>
                        <div className="ru" style={{marginLeft:0,marginTop:2}}>{dispSpeed(g.speedAtRedline)} @ redline</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="card">
              <div className="ch">Shift Analysis</div>
              <div className="cb">
                <div className="stat-grid">
                  {result.shifts.map(s=>(
                    <div key={s.from} className="ro ro-col">
                      <div className="ro-hdr">
                        <span className="rl">{s.from} → {s.to}</span>
                      </div>
                      <div style={{display:'flex',alignItems:'baseline',gap:3}}>
                        <span className="rv-sm">{Math.round(s.landingRpm)}</span>
                        <span className="ru">rpm</span>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:6}}>
                        <span className="pbar"><span className="pbar-fill" style={{width:round(s.powerBandPct,0)+'%'}}/></span>
                        <span className="ru" style={{marginLeft:0,whiteSpace:'nowrap'}}>{round(s.powerBandPct,0)}%</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </React.Fragment>}
        </div>
      </div>
      </div>
    </React.Fragment>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  render(){
    if(this.state.error){
      return <div className="err">GEAR.OS crashed: {String(this.state.error.message||this.state.error)}</div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
<script>
(function(){
  var preload=document.getElementById('pre-load');
  function showError(msg,detail){
    if(preload){
      preload.style.display='block';
      preload.innerHTML='<div style="color:#e2e8f0;font-size:14px;margin-bottom:8px">GEAR.OS — Failed to load</div>'
        +'<div style="color:#6b7280;margin-bottom:12px">'+msg+'</div>'
        +'<div style="background:#0f172a;padding:12px;border-radius:4px;color:#ef4444;word-break:break-all;line-height:1.6;font-size:11px">'+(detail||'')+'</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px">RELOAD</button>';
    }
  }
  try{
    if(typeof Babel==='undefined'){showError('Babel failed to load','Check your internet connection and reload.');return;}
    var src=document.getElementById('app-source').textContent;
    var compiled;
    try{
      compiled=Babel.transform(src,{
        presets:['env','react'],
        plugins:['transform-optional-chaining','transform-nullish-coalescing-operator','transform-logical-assignment-operators'],
        filename:'gear-os.jsx'
      }).code;
    }catch(e){
      showError('Babel compilation failed',e.message||String(e));
      return;
    }
    // Use indirect eval so errors are catchable on all browsers including iOS WebKit.
    try{
      (0,eval)(compiled);
    }catch(e){
      showError('Runtime error',e.message||String(e));
    }
  }catch(e){
    showError('Load failed',e.message||String(e));
  }
})();
</script>
</body>
</html>
